<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>History · vFootball</title>
<link rel="icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="wrap">
  <p class="lede">Every slip you booked — the favourite side the screen picked, and how it finished. Paper only.</p>

  <div class="stats" id="stats" hidden>
    <div class="stat"><b id="s-hit">—</b><span>Leg hit-rate</span></div>
    <div class="stat"><b id="s-be">—</b><span>Break-even</span></div>
    <div class="stat" id="pnl-tile"><b id="s-pnl">—</b><span>Paper P&amp;L</span></div>
  </div>
  <p class="note" id="verdict"></p>

  <div id="slips"><div class="skel"></div><div class="skel"></div></div>
  <p class="note" id="note"></p>
</main>
<script src="/js/core.js"></script>
<script>
(function () {
  var V = window.VFS;
  V.injectChrome("ledger");

  function pct(x) { return (x * 100).toFixed(1) + "%"; }

  function render(slips) {
    // settled first, then live/open — all grouped by day (settled date, else booked date)
    var settled = slips.filter(function (s) { return s.status === "won" || s.status === "lost"; });
    var active = slips.filter(function (s) { return s.status === "open" || s.status === "live"; });

    var st = V.legStats(slips);
    if (st.legs > 0) {
      document.getElementById("s-hit").textContent = pct(st.hit) + " (" + st.wins + "/" + st.legs + ")";
      document.getElementById("s-be").textContent = pct(st.breakeven);
      var pnl = document.getElementById("s-pnl");
      pnl.textContent = (st.pnl >= 0 ? "+" : "") + V.naira(st.pnl);
      document.getElementById("pnl-tile").classList.toggle("go", st.pnl >= 0);
      document.getElementById("pnl-tile").classList.toggle("bad", st.pnl < 0);
      document.getElementById("stats").hidden = false;

      var v = document.getElementById("verdict");
      if (st.legs < 30) {
        v.textContent = "Only " + st.legs + " settled picks — too few to tell yet. Interval " +
          pct(st.lo) + "–" + pct(st.hi) + " vs break-even " + pct(st.breakeven) + ".";
      } else if (st.lo > st.breakeven) {
        v.textContent = "Beating the prices: whole interval " + pct(st.lo) + "–" + pct(st.hi) +
          " sits above break-even " + pct(st.breakeven) + ".";
      } else if (st.hi < st.breakeven) {
        v.textContent = "Losing to the prices: interval " + pct(st.lo) + "–" + pct(st.hi) +
          " is below break-even " + pct(st.breakeven) + ".";
      } else {
        v.textContent = "Indistinguishable from the prices so far: " + pct(st.lo) + "–" + pct(st.hi) +
          " straddles break-even " + pct(st.breakeven) + ".";
      }
    }

    var box = document.getElementById("slips");
    box.textContent = "";
    if (!slips.length) {
      box.appendChild(V.el("div", "empty",
        "No slips yet. On Matches, tap a side to build a slip, then save it on Betslip — it shows up here with its result."));
      return;
    }

    function group(title, list) {
      if (!list.length) return;
      box.appendChild(V.el("div", "day", title));
      var lastDay = "\u0000";
      list.forEach(function (sp) {
        var when = sp.settledAt || sp.createdAt;
        var d = V.dayLabel(when ? Date.parse(when) : null);
        if (d && d !== lastDay) { lastDay = d; box.appendChild(V.el("div", "day sub", d)); }
        box.appendChild(V.slipCard(sp));
      });
    }
    if (active.length) group("In play / open", active);
    group(settled.length ? "Settled" : "", settled);
    document.getElementById("note").textContent =
      slips.length + " slip(s) · " + st.slipsWon + " won, " + st.slipsLost + " lost, " +
      active.length + " running.";
  }

  function load() {
    V.fetchSlips(true)
      .then(function (d) { render(d.slips || []); })
      .catch(function (e) {
        document.getElementById("slips").innerHTML = '<p class="err">' + e.message + "</p>";
      });
  }
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
