<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>History · vFootball</title>
<link rel="icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="wrap">
  <p class="lede">Games that have <b>finished</b>, with their full-time result. Nothing in play — only what's played out.</p>

  <div class="chips" id="views"></div>

  <div class="stats" id="stats" hidden>
    <div class="stat"><b id="s-hit">—</b><span>Hit-rate</span></div>
    <div class="stat"><b id="s-be">—</b><span>Break-even</span></div>
    <div class="stat" id="pnl-tile"><b id="s-pnl">—</b><span>Flat P&amp;L</span></div>
  </div>
  <p class="note" id="verdict"></p>

  <div id="out"><div class="skel"></div><div class="skel"></div></div>
  <p class="note" id="note"></p>
</main>
<script src="/js/core.js"></script>
<script>
(function () {
  var V = window.VFS;
  V.injectChrome("ledger");
  var view = "screen";  // "screen" = auto-picks, "slips" = my booked slips

  function pct(x) { return (x * 100).toFixed(1) + "%"; }

  function paintViews() {
    var box = document.getElementById("views");
    box.textContent = "";
    [["screen", "Screen's picks"], ["slips", "My slips"]].forEach(function (v) {
      var b = V.el("button", "chip" + (view === v[0] ? " on" : ""), v[1]);
      b.addEventListener("click", function () { view = v[0]; render(); });
      box.appendChild(b);
    });
  }

  function stats(st) {
    var wrap = document.getElementById("stats");
    if (!st.legs) { wrap.hidden = true; document.getElementById("verdict").textContent = ""; return; }
    document.getElementById("s-hit").textContent = pct(st.hit) + " (" + st.wins + "/" + st.legs + ")";
    document.getElementById("s-be").textContent = pct(st.breakeven);
    var pnl = document.getElementById("s-pnl");
    pnl.textContent = (st.pnl >= 0 ? "+" : "") + (Math.round(st.pnl * 100) / 100) + "u";
    document.getElementById("pnl-tile").classList.toggle("go", st.pnl >= 0);
    document.getElementById("pnl-tile").classList.toggle("bad", st.pnl < 0);
    wrap.hidden = false;
    var v = document.getElementById("verdict");
    if (st.legs < 30) v.textContent = "Only " + st.legs + " settled — too few to tell. Band " + pct(st.lo) + "–" + pct(st.hi) + " vs break-even " + pct(st.breakeven) + ".";
    else if (st.lo > st.breakeven) v.textContent = "Beating the prices: " + pct(st.lo) + "–" + pct(st.hi) + " is above break-even " + pct(st.breakeven) + ".";
    else if (st.hi < st.breakeven) v.textContent = "Losing to the prices: " + pct(st.lo) + "–" + pct(st.hi) + " is below break-even " + pct(st.breakeven) + ".";
    else v.textContent = "Indistinguishable so far: " + pct(st.lo) + "–" + pct(st.hi) + " straddles break-even " + pct(st.breakeven) + ".";
  }

  function group(out, items, dateOf, cardOf) {
    var last = "\u0000";
    items.forEach(function (it) {
      var d = V.dayLabel(dateOf(it));
      if (d && d !== last) { last = d; out.appendChild(V.el("div", "day", d)); }
      out.appendChild(cardOf(it));
    });
  }

  function renderScreen() {
    V.fetchPicks(true).then(function (d) {
      var picks = (d.picks || []).filter(function (p) { return p.won === true || p.won === false; });
      stats(V.pickStats(picks));
      var out = document.getElementById("out"); out.textContent = "";
      if (!picks.length) {
        out.appendChild(V.el("div", "empty", "No finished picks yet. The screen records every match it makes; they show here once they've played."));
      } else {
        group(out, picks, function (p) { return p.settledAt ? Date.parse(p.settledAt) : p.kickoff; }, V.pickCard);
      }
      document.getElementById("note").textContent = picks.length + " settled pick(s), newest first.";
    }).catch(function (e) { document.getElementById("out").innerHTML = '<p class="err">' + e.message + "</p>"; });
  }

  function renderSlips() {
    V.fetchSlips(false).then(function (d) {
      var slips = (d.slips || []).filter(function (s) { return s.status === "won" || s.status === "lost"; });
      stats(V.legStats(slips));
      var out = document.getElementById("out"); out.textContent = "";
      if (!slips.length) {
        out.appendChild(V.el("div", "empty", "No settled slips yet. Book a slip on Betslip; once its games finish it appears here."));
      } else {
        group(out, slips, function (s) { return s.settledAt ? Date.parse(s.settledAt) : (s.createdAt ? Date.parse(s.createdAt) : null); }, V.slipCard);
      }
      document.getElementById("note").textContent = slips.length + " settled slip(s).";
    }).catch(function (e) { document.getElementById("out").innerHTML = '<p class="err">' + e.message + "</p>"; });
  }

  function render() {
    paintViews();
    document.getElementById("stats").hidden = true;
    document.getElementById("out").innerHTML = '<div class="skel"></div><div class="skel"></div>';
    if (view === "screen") renderScreen(); else renderSlips();
  }
  render();
  setInterval(render, 60000);
})();
</script>
</body>
</html>
