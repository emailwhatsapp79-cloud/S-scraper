<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vantage">
<meta name="description" content="Screens today's remaining SportyBet vFootball card for your odds shape.">
<title>Matches · Vantage</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css?v=rate4">
</head>
<body>
<main class="wrap">
  <p class="lede">Upcoming vFootball only. Ready slips skip same-kick-off stacks. Each leg is rated by how often <em>Home or Draw / Draw or Away</em> lands — not by home 1.80 vs away 5.00. A 1.80 still only wins the match about half the time. Tap Book.</p>

  <section id="packs" class="packs" hidden></section>

  <div class="stats" id="stats" hidden>
    <div class="stat"><b id="s-scan">—</b><span>Scanned</span></div>
    <div class="stat go"><b id="s-hit">—</b><span>Matched</span></div>
    <div class="stat"><b id="s-next">—</b><span>Next kick-off</span></div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="out">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
  <p class="note" id="note"></p>
</main>
<script src="/js/core.js?v=rate4"></script>
<script>
(function () {
  var V = window.VFS;
  V.injectChrome("matches", '<button class="ghost" id="refresh" type="button">Refresh</button>');
  var league = "All";
  var last = null;
  var booked = {};

  function idsOf(legs) {
    var t = {};
    (legs || []).forEach(function (l) {
      if (l.id) t[l.id] = 1;
      if (l.eventId) t[l.eventId] = 1;
    });
    return t;
  }

  function packCard(n, legs) {
    var card = V.el("div", "slip pack");
    var h = V.el("div", "slip-h");
    var hit = V.packHit(legs);
    h.appendChild(V.el("span", "badge open", n + "-leg · lands " + hit.pct + "%"));
    var odds = V.acca(legs.map(function (l) { return l.price; }));
    var stake = V.stakeOf();
    h.appendChild(V.el("span", "tot", odds.toFixed(2) + " → " + V.naira(Math.round(stake * odds * 100) / 100)));
    card.appendChild(h);
    card.appendChild(V.el("p", "note",
      "Rated on the double chance, not the 1.80 home. A 1.80 still wins the match ~half the time. Combined " +
      hit.pct + "% is the book’s own 1X/X2 × each other — not a lock."));
    legs.forEach(function (l) {
      var row = V.el("div", "leg wait");
      var left = V.el("div", "leg-teams");
      left.appendChild(V.teamsBlock(l.home, l.away));
      var sel = V.el("div", "sel", l.label + " @ " + Number(l.price).toFixed(2));
      left.appendChild(sel);
      var rate = (l.pct != null ? (l.pct + "% lands") : "") +
        (l.winPct != null ? (" · fav wins " + l.winPct + "%") : "") +
        (l.dogPct != null ? (" · dog " + l.dogPct + "%") : "");
      if (rate) left.appendChild(V.el("div", "rate", rate));
      row.appendChild(left);
      var mid = V.el("div", "leg-mid");
      mid.appendChild(V.el("div", "kick", V.clock(l.kickoff)));
      var t = V.until(l.kickoff);
      if (t.text) {
        var ph = V.el("div", "phase", t.text);
        ph.setAttribute("data-kick", l.kickoff || "");
        mid.appendChild(ph);
      }
      row.appendChild(mid);
      var pill = V.el("div", "wait-pill" + (l.grade ? " g-" + l.grade : ""),
        (l.pct != null ? l.pct + "%" : V.leagueKey(l)));
      row.appendChild(pill);
      card.appendChild(row);
    });

    var go = V.el("button", "primary", "Book " + n);
    go.type = "button";
    if (booked[n]) {
      go.disabled = true;
      go.classList.add("done");
      go.textContent = booked[n];
    }
    go.addEventListener("click", function () {
      if (go.disabled) return;
      go.disabled = true;
      go.textContent = "Booking…";
      V.bookLegs(legs, stake).then(function (slip) {
        var label = slip.shareCode ? ("Booked · " + slip.shareCode) : "Booked";
        booked[n] = label;
        go.classList.add("done");
        go.textContent = label;
        V.paintSlip();
        if (slip.shareCode && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(slip.shareCode).catch(function () {});
        }
      }).catch(function (e) {
        go.disabled = false;
        go.textContent = e.message || "Could not book";
      });
    });
    card.appendChild(go);
    return card;
  }

  function renderPacks(games) {
    var box = document.getElementById("packs");
    box.textContent = "";
    var five = V.spreadPack(games, 5, { gapMin: 8, soonMin: 4 });
    var ten = V.spreadPack(games, 10, { gapMin: 6, soonMin: 4, taken: idsOf(five) });
    if (ten.length < 10) ten = V.spreadPack(games, 10, { gapMin: 6, soonMin: 4 });
    if (!five.length && ten.length < 5) {
      box.hidden = true;
      return;
    }
    var title = V.el("h2", "slips-h", "Ready to book");
    box.appendChild(title);
    if (five.length === 5) box.appendChild(packCard(5, five));
    if (ten.length === 10) box.appendChild(packCard(10, ten));
    else if (ten.length >= 7) box.appendChild(packCard(ten.length, ten));
    if (five.length === 5 && ten.length === 10) {
      var overlap = five.some(function (a) { return ten.some(function (b) { return a.id === b.id; }); });
      box.appendChild(V.el("p", "note", overlap
        ? "The 10 includes the 5. Book one, not both, or you double those legs."
        : "The 10 is a different set from the 5. Booking both is two slips."));
    }
    if (typeof V.sameSlotClusters === "function") {
      var clusters = V.sameSlotClusters(games, { soonMin: 4 });
      if (clusters.length) {
        var skip = V.el("div", "skip-slots");
        skip.appendChild(V.el("h3", "", "Same-slot stacks — packs take one, skip the rest"));
        clusters.forEach(function (c) {
          var line = V.clock(c[0].kickoff) + "  " + c.map(function (x) {
            return x.home + "–" + x.away;
          }).join(" · ");
          skip.appendChild(V.el("p", "", line));
        });
        box.appendChild(skip);
      }
    }
    box.hidden = !box.children.length;
  }

  function chips(matched) {
    var counts = { All: matched.length };
    matched.forEach(function (g) {
      var k = V.leagueKey(g);
      counts[k] = (counts[k] || 0) + 1;
    });
    var box = document.getElementById("chips");
    box.textContent = "";
    ["All", "England", "Spain", "Italy", "Germany", "France"].forEach(function (name) {
      if (name !== "All" && !counts[name]) return;
      var b = V.el("button", "chip" + (league === name ? " on" : ""), name + " " + (counts[name] || 0));
      b.addEventListener("click", function () { league = name; render(); });
      box.appendChild(b);
    });
  }

  function render() {
    if (!last) return;
    var games = last.games || [];
    renderPacks(games);
    var hits = [];
    games.forEach(function (g) {
      if (league !== "All" && V.leagueKey(g) !== league) return;
      var r;
      try { r = V.screen(g); } catch (e) { return; }
      if (r.verdict === "show") hits.push([g, r]);
    });
    hits.sort(function (a, b) { return V.byKick(a[0], b[0]); });
    document.getElementById("s-scan").textContent = String(games.length);
    document.getElementById("s-hit").textContent = String(hits.length);
    var nextG = hits[0] ? hits[0][0] : null;
    var next = nextG && nextG.kickoff ? V.until(nextG.kickoff).text.replace("in ", "") : "—";
    document.getElementById("s-next").textContent = next || "—";
    document.getElementById("stats").hidden = false;
    var matchedAll = [];
    games.forEach(function (g) {
      try { if (V.screen(g).verdict === "show") matchedAll.push(g); } catch (e) {}
    });
    chips(matchedAll);

    var out = document.getElementById("out");
    out.textContent = "";
    if (!hits.length) {
      var empty = V.el("div", "empty");
      empty.innerHTML = "<b>None of the upcoming games match this shape.</b><br>Open Card to browse the full list, or loosen the bands on Rules.";
      out.appendChild(empty);
    } else {
      hits.forEach(function (p, i) {
        out.appendChild(V.card(p[0], p[1], {
          checks: true,
          pickable: true,
          n: i + 1,
          picked: V.inBook(p[0].id),
          onPick: function () { render(); V.paintSlip(); }
        }));
      });
    }
    var n = document.getElementById("note");
    n.textContent = (last.cached ? "From the last read · " : "") +
      (last.fromLiveFeeds || games.length) + " games · " + last.tookMs + "ms" +
      (last.saveError ? " · save: " + last.saveError : "") +
      (last.feedErrors && last.feedErrors.length ? " · " + last.feedErrors.join("; ") : "");
    V.paintSlip();
    V.tick();
  }

  function load(quiet, force) {
    var btn = document.getElementById("refresh");
    if (btn) btn.disabled = true;
    if (!quiet) document.getElementById("out").innerHTML =
      '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    V.fetchGames(force).then(function (d) {
      last = d; render();
    }).catch(function (e) {
      document.getElementById("out").innerHTML = '<p class="err">' + e.message + "</p>";
    }).then(function () { if (btn) btn.disabled = false; });
  }

  document.getElementById("refresh").addEventListener("click", function () { load(false, true); });
  window.addEventListener("vfs-ready", function () { if (last) render(); });
  load(false, false);
  setInterval(function () { load(true, false); }, 180000);
})();
</script>
</body>
</html>
