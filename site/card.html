<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Card · Vantage</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="wrap">
  <p class="lede">Every remaining vFootball game today, not just the ones that pass. Tap a row for markets.</p>
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="Team or game ID" enterkeyhint="search">
  </div>
  <div class="chips" id="chips"></div>
  <div id="out">
    <div class="skel"></div><div class="skel"></div>
  </div>
  <p class="note" id="note"></p>
</main>
<script src="/js/core.js"></script>
<script>
(function () {
  var V = window.VFS;
  V.injectChrome("card", '<button class="gear-btn" id="refresh" type="button" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>');
  var league = "All", q = "", last = null;

  function visible() {
    var games = (last && last.games) || [];
    var needle = q.trim().toLowerCase();
    return games.filter(function (g) {
      if (league !== "All" && V.leagueKey(g) !== league) return false;
      if (!needle) return true;
      return (g.home + " " + g.away + " " + g.id + " " + (g.league || "")).toLowerCase().indexOf(needle) >= 0;
    });
  }

  function render() {
    if (!last) return;
    var all = last.games || [];
    var counts = { All: all.length };
    all.forEach(function (g) {
      var k = V.leagueKey(g);
      counts[k] = (counts[k] || 0) + 1;
    });
    var box = document.getElementById("chips");
    box.textContent = "";
    ["All", "England", "Spain", "Italy", "Germany", "France"].forEach(function (name) {
      if (name !== "All" && !counts[name]) return;
      var b = V.el("button", "chip" + (league === name ? " on" : ""), name);
      b.addEventListener("click", function () { league = name; render(); });
      box.appendChild(b);
    });

    var games = visible().slice().sort(V.byKick);
    var out = document.getElementById("out");
    out.textContent = "";
    var day = "";
    games.forEach(function (g) {
      var label = V.dayLabel(g.kickoff);
      if (label !== day) {
        day = label;
        out.appendChild(V.el("div", "day", day));
      }
      var r;
      try { r = V.screen(g); } catch (e) { return; }
      out.appendChild(V.compactRow(g, r));
    });
    if (!games.length) {
      out.appendChild(V.el("div", "empty", "Nothing in this slice of the card."));
    }
    document.getElementById("note").textContent = games.length + " of " + all.length + " upcoming";
    V.tick();
  }

  function load(force) {
    var btn = document.getElementById("refresh");
    if (btn) btn.disabled = true;
    V.fetchGames(force).then(function (d) { last = d; render(); })
      .catch(function (e) {
        document.getElementById("out").innerHTML = '<p class="err">' + e.message + "</p>";
      })
      .then(function () { if (btn) btn.disabled = false; });
  }

  document.getElementById("q").addEventListener("input", function (e) {
    q = e.target.value; render();
  });
  document.getElementById("refresh").addEventListener("click", function () { load(true); });
  load(false);
})();
</script>
</body>
</html>
