<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Table Tennis · Vantage</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  .tt-card { background: var(--card); box-shadow: var(--shadow); border-radius: var(--r); margin-bottom: 10px; padding: 13px 14px }
  .tt-top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px }
  .tt-tourn { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); font-weight: 600 }
  .tt-when { margin-left: auto; font-family: var(--mono); font-size: 12.5px; color: var(--dim) }
  .tt-when.soon { color: var(--hold) } .tt-when.now { color: var(--bad) }

  /* Players + de-vigged win chance */
  .tt-players { display: grid; gap: 7px; margin-bottom: 11px }
  .tt-pl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px }
  .tt-pl b { font-size: 15.5px; font-weight: 650; letter-spacing: -.01em }
  .tt-pl.fav b { color: var(--ink) }
  .tt-pct { display: flex; align-items: center; gap: 8px; min-width: 96px }
  .tt-bar { flex: 1; height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; box-shadow: var(--shadow) }
  .tt-bar > i { display: block; height: 100%; border-radius: 999px; background: var(--dim) }
  .tt-pl.fav .tt-bar > i { background: var(--good, #37c76a) }
  .tt-pct b { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--dim); min-width: 34px; text-align: right }
  .tt-pl.fav .tt-pct b { color: var(--ink) }

  /* Tappable cells (winner + correct score) */
  .tt-mkt-lab { font-size: 11px; letter-spacing: .03em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin: 2px 0 6px }
  .tt-g { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 4px }
  .tt-cell { background: var(--bg); box-shadow: var(--shadow); border-radius: var(--r3); padding: 9px 6px; text-align: center; -webkit-user-select: none; user-select: none }
  .tt-cell b { display: block; font-family: var(--mono); font-size: 15px; font-weight: 600 }
  .tt-cell span { display: block; font-size: 10.5px; color: var(--dim); margin-top: 2px }
  .tt-cell.tap { cursor: pointer; transition: transform .06s ease }
  .tt-cell.tap:active { transform: scale(.97) }
  .tt-cell.fav { box-shadow: inset 0 0 0 1px var(--line, rgba(255,255,255,.14)), var(--shadow) }
  .tt-cell.on { background: var(--good, #37c76a); color: #04140a }
  .tt-cell em { display: block; font-style: normal; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--go); margin-top: 1px }
  .tt-cell .book { display: block; font-size: 10.5px; color: var(--faint); margin-top: 2px }
  .tt-cell.on em, .tt-cell.on .book { color: #04140a }
  .tt-pl .n { font-size: 11px; color: var(--faint); font-weight: 600; margin-left: 6px }
  .tt-stat th, .tt-stat td { padding: 7px 4px; text-align: center }
  .tt-stat thead th { font-size: 12.5px; font-weight: 650; color: var(--ink); letter-spacing: -.01em }
  .tt-stat tbody th { text-align: left; font-size: 10.5px; letter-spacing: .03em; text-transform: uppercase; color: var(--faint); font-weight: 600 }
  .tt-stat td { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink) }
  .tt-stat td.hi { color: var(--go) }
  .tt-stat tr { border-bottom: 1px solid rgba(255,255,255,.06) }
  .tt-stat tr:last-child { border: 0 }

  .tt-cs { margin-top: 10px }
  .tt-cs-side { margin-top: 8px }
  .tt-cs-lab { display: block; font-size: 10.5px; color: var(--dim); margin-bottom: 5px }
  .tt-cs-lab b { color: var(--ink); font-weight: 600 }
  .tt-cs-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px }
  .tt-cs-row.four { grid-template-columns: repeat(4, 1fr) }
  .tt-cs-cell b { font-size: 14.5px }
  .tt-cs-cell span { font-size: 10px }

  /* Results */
  .tt-res { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; background: var(--card); box-shadow: var(--shadow); border-radius: var(--r); margin-bottom: 8px; padding: 11px 14px }
  .tt-res .who { display: grid; gap: 3px; min-width: 0 }
  .tt-res .who .r { display: flex; align-items: center; gap: 8px }
  .tt-res .who .r b { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .tt-res .who .r.win b { color: var(--good, #37c76a) }
  .tt-res .who .r .s { margin-left: auto; font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--dim) }
  .tt-res .who .r.win .s { color: var(--ink) }
  .tt-res .rt { text-align: right }
  .tt-res .rt .tn { font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--faint); font-weight: 600 }
  .tt-res .rt time { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin-top: 3px }

  .seg { display: inline-flex; background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 3px; gap: 3px; margin-bottom: 12px }
  .stats { grid-template-columns: 1fr 1fr }
  .seg button { border: 0; background: transparent; color: var(--dim); font: inherit; font-weight: 600; font-size: 13px; padding: 6px 14px; border-radius: 999px; cursor: pointer }
  .seg button.on { background: var(--bg); color: var(--ink) }
</style>
</head>
<body>
<main class="wrap">
  <div class="stats">
    <div class="stat"><b id="s-up">—</b><span>On the card</span></div>
    <div class="stat go"><b id="s-settled">—</b><span>Finished — trains %</span></div>
  </div>
  <p class="note" id="sofa-note"></p>
  <div class="seg" id="seg">
    <button type="button" data-mode="up" class="on">Upcoming</button>
    <button type="button" data-mode="res">Results</button>
  </div>
  <div class="chips" id="tourns"></div>
  <h2 class="lab-h" id="head">Upcoming</h2>
  <div id="out"><div class="skel"></div><div class="skel"></div></div>
</main>
<script src="/js/core.js"></script>
<script>
(function () {
  var V = window.VFS;
  V.injectChrome("tt");
  var LAST = null, LEAGUE = "All", MODE = "up";

  function odds(v) { return (v == null || !isFinite(Number(v))) ? "—" : Number(v).toFixed(2); }

  function whenEl(g) {
    var t = V.until(g.start);
    var e = V.el("time", "tt-when " + (t.cls || ""), (t.text || V.clock(g.start) || "").trim() || V.clock(g.start));
    e.setAttribute("data-kick", String(g.start || ""));
    return e;
  }

  // Standard book leg — one selection per match, same as the football slip.
  function pickGame(g) {
    return { id: g.id, eventId: g.eventId || null, home: g.home, away: g.away,
             league: g.tourn || "Table tennis", kickoff: g.start || null };
  }
  function currentSel(id) {
    var legs = V.loadBook();
    for (var i = 0; i < legs.length; i++) if (legs[i].id === id) return legs[i].selection;
    return null;
  }
  function tapCell(g, sel, price, label, cls, pct, book) {
    var can = price != null && isFinite(Number(price));
    var on = can && currentSel(g.id) === sel;
    var c = V.el("div", "tt-cell " + (cls || "") + (can ? " tap" : "") + (on ? " on" : ""));
    c.appendChild(V.el("b", null, odds(price)));
    c.appendChild(V.el("span", null, label));
    if (pct != null && isFinite(pct)) c.appendChild(V.el("em", null, "Ours " + pct + "%"));
    if (book != null && isFinite(book)) c.appendChild(V.el("span", "book", "Book " + book + "%"));
    if (can) {
      c.setAttribute("role", "button");
      c.tabIndex = 0;
      var go = function (e) {
        e.stopPropagation();
        V.toggleBook(V.makePick(pickGame(g), sel, price, label));
        render();
      };
      c.addEventListener("click", go);
      c.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(e); }
      });
    }
    return c;
  }

  function playersBlock(g) {
    var pct = g.ours || g.pct || null;
    var favHome = pct ? pct.home >= pct.away : (g.win && g.win.home != null && g.win.away != null && g.win.home <= g.win.away);
    var box = V.el("div", "tt-players");
    [[g.home, pct && pct.home, favHome, g.nH], [g.away, pct && pct.away, !favHome, g.nA]].forEach(function (p) {
      var row = V.el("div", "tt-pl" + (p[2] && p[1] != null ? " fav" : ""));
      var nm = V.el("b", null, p[0]);
      if (p[3]) nm.appendChild(V.el("span", "n", " · " + comma(p[3])));
      row.appendChild(nm);
      if (p[1] != null) {
        var pc = V.el("div", "tt-pct");
        var bar = V.el("div", "tt-bar");
        var fill = V.el("i");
        fill.style.width = Math.max(4, Math.min(100, p[1])) + "%";
        bar.appendChild(fill);
        pc.appendChild(bar);
        pc.appendChild(V.el("b", null, p[1] + "%"));
        row.appendChild(pc);
      }
      box.appendChild(row);
    });
    return box;
  }

  function comma(n) {
    n = Number(n);
    return isFinite(n) ? n.toLocaleString("en-US") : "—";
  }

  function lastNameOf(s) {
    var t = String(s || "").trim();
    if (t.indexOf(",") >= 0) return t.split(",")[0].trim();
    var p = t.split(/\s+/);
    return p[p.length - 1] || t;
  }

  function cell(tag, text, cls) {
    var e = document.createElement(tag);
    e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  function statsTable(g) {
    var hn = lastNameOf(g.home), an = lastNameOf(g.away);
    var h = g.h2hRec || {};
    var fh = g.formH, fa = g.formA;
    var t = document.createElement("table");
    t.className = "tt-stat";
    var head = document.createElement("thead");
    var hr = document.createElement("tr");
    hr.appendChild(cell("th", ""));
    hr.appendChild(cell("th", hn));
    hr.appendChild(cell("th", an));
    head.appendChild(hr);
    t.appendChild(head);
    var body = document.createElement("tbody");
    function row(lab, a, b, hiA, hiB) {
      var tr = document.createElement("tr");
      tr.appendChild(cell("th", lab));
      tr.appendChild(cell("td", a, hiA ? "hi" : ""));
      tr.appendChild(cell("td", b, hiB ? "hi" : ""));
      body.appendChild(tr);
    }
    var nH = g.nH || 0, nA = g.nA || 0;
    row("Played", comma(nH), comma(nA), nH > nA, nA > nH);
    if (h.n) row("Head to head", String(h.home), String(h.away), h.home > h.away, h.away > h.home);
    else row("Head to head", "—", "—");
    if (h.n && (h.setsH || h.setsA)) {
      row("H2H sets", String(h.setsH || 0), String(h.setsA || 0), h.setsH > h.setsA, h.setsA > h.setsH);
    }
    row(
      "Last 50",
      fh ? fh.w + "W · " + fh.l + "L" : "—",
      fa ? fa.w + "W · " + fa.l + "L" : "—",
      fh && fa && fh.w > fa.w,
      fh && fa && fa.w > fh.w
    );
    if (fh && fa && (fh.sw || fa.sw)) {
      row("Sets", fh.sw + "–" + fh.sl, fa.sw + "–" + fa.sl, fh.sw - fh.sl > fa.sw - fa.sl, fa.sw - fa.sl > fh.sw - fh.sl);
      row("3–0 wins", String(fh.straight || 0), String(fa.straight || 0), fh.straight > fa.straight, fa.straight > fh.straight);
    }
    t.appendChild(body);
    return t;
  }

  function card(g) {
    var box = V.el("article", "tt-card");
    var top = V.el("div", "tt-top");
    top.appendChild(V.el("span", "tt-tourn", g.tourn || "Table tennis"));
    top.appendChild(whenEl(g));
    box.appendChild(top);

    box.appendChild(playersBlock(g));
    box.appendChild(statsTable(g));

    box.appendChild(V.el("div", "tt-mkt-lab", "Winner"));
    var grid = V.el("div", "tt-g");
    var pct = g.ours || g.pct || null;
    var book = g.book || null;
    var favHome = pct ? pct.home >= pct.away : false;
    grid.appendChild(tapCell(g, "1", g.win && g.win.home, "Home", favHome ? "fav" : "", pct && pct.home, book && book.home));
    grid.appendChild(tapCell(g, "2", g.win && g.win.away, "Away", (pct && !favHome) ? "fav" : "", pct && pct.away, book && book.away));
    box.appendChild(grid);
    return box;
  }

  function resultRow(g) {
    var box = V.el("div", "tt-res");
    var who = V.el("div", "who");
    var hs = g.res ? g.res.home : null, as = g.res ? g.res.away : null;
    [[g.home, hs, hs != null && as != null && hs > as], [g.away, as, hs != null && as != null && as > hs]].forEach(function (p) {
      var r = V.el("div", "r" + (p[2] ? " win" : ""));
      r.appendChild(V.el("b", null, p[0]));
      r.appendChild(V.el("span", "s", p[1] == null ? "–" : String(p[1])));
      who.appendChild(r);
    });
    box.appendChild(who);
    var rt = V.el("div", "rt");
    rt.appendChild(V.el("div", "tn", g.tourn || "Table tennis"));
    var tm = V.el("time", null, V.clock(g.start) || "");
    rt.appendChild(tm);
    box.appendChild(rt);
    return box;
  }

  function filtered(list) {
    return LEAGUE === "All" ? list : list.filter(function (g) { return (g.tourn || "Other") === LEAGUE; });
  }

  function tourns(games) {
    var counts = { All: games.length };
    games.forEach(function (g) { var k = g.tourn || "Other"; counts[k] = (counts[k] || 0) + 1; });
    var names = Object.keys(counts).filter(function (k) { return k !== "All"; })
      .sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 6);
    var box = document.getElementById("tourns");
    box.textContent = "";
    ["All"].concat(names).forEach(function (name) {
      var b = V.el("button", "chip" + (LEAGUE === name ? " on" : ""), name + " " + (counts[name] || 0));
      b.type = "button";
      b.addEventListener("click", function () { LEAGUE = name; render(); });
      box.appendChild(b);
    });
  }

  function render() {
    var out = document.getElementById("out");
    out.textContent = "";
    var base = (LAST && (MODE === "res" ? LAST.results : LAST.games)) || [];
    var list = filtered(base);
    if (!list.length) {
      out.appendChild(V.el("div", "empty", MODE === "res"
        ? "No results banked yet — they fill in as matches finish."
        : "No upcoming table tennis on the card right now."));
    } else if (MODE === "res") {
      list.forEach(function (g) { out.appendChild(resultRow(g)); });
    } else {
      list.forEach(function (g) { out.appendChild(card(g)); });
    }
    document.getElementById("head").textContent = (MODE === "res" ? "Results — " : "Upcoming — ") + list.length;
    tourns(base);
    V.tick();
  }

  document.getElementById("seg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-mode]");
    if (!b) return;
    MODE = b.getAttribute("data-mode");
    Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) {
      x.classList.toggle("on", x === b);
    });
    LEAGUE = "All";
    render();
  });

  function readJson(r) {
    return r.text().then(function (t) {
      try { return JSON.parse(t); } catch { return { ok: false, error: "fill timeout" }; }
    });
  }

  function apply(d) {
    LAST = d;
    document.getElementById("s-up").textContent = String(d.count || 0);
    document.getElementById("s-settled").textContent = comma(d.settled || 0);
    render();
  }

  function fillPass() {
    var sn = document.getElementById("sofa-note");
    sn.textContent = "Refreshing history… " + comma(document.getElementById("s-settled").textContent.replace(/,/g, "") || 0);
    return fetch("/api/tt-fill").then(readJson).then(function (f) {
      if (f && f.settled != null) document.getElementById("s-settled").textContent = comma(f.settled);
      var keep = f && (f.hasMore || f.error || (f.s24 && (f.s24.hasMore || f.s24.error)));
      if (keep) return new Promise(function (ok) { setTimeout(ok, 800); }).then(fillPass);
      sn.textContent = comma(f && f.settled) + " in the pile — catching new results every 2 min";
      return fetch("/api/tt").then(readJson).then(function (d) {
        if (d && d.ok) apply(d);
      }).then(function () {
        setTimeout(fillPass, 120000);
      });
    }).catch(function () { setTimeout(fillPass, 4000); });
  }

  fetch("/api/tt").then(readJson).then(function (d) {
    if (!d.ok) throw new Error(d.error || "Could not read the table-tennis card");
    apply(d);
    return fillPass();
  }).catch(function (e) {
    if (LAST) return;
    document.getElementById("out").textContent = "";
    document.getElementById("out").appendChild(V.el("div", "empty", e.message));
  });
})();
</script>
</body>
</html>
