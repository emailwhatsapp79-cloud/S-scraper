<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Finder · Vantage</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  .fx-rank { display: flex; align-items: center; gap: 10px; margin-bottom: 10px }
  .fx-rank .idx { font-size: 13px; min-width: 26px; height: 26px }
  .fx-lead { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px }
  .fx-lead b { font: 700 20px/1 var(--mono); color: var(--go); letter-spacing: -.02em }
  .fx-lead span { font-size: 13.5px; color: var(--ink); font-weight: 600 }
  .fx-lead em { font-style: normal; color: var(--dim); font-size: 12.5px; font-family: var(--mono) }
</style>
</head>
<body>
<main class="wrap">
  <div class="stats" id="stats" hidden>
    <div class="stat"><b id="s-wx">—</b><span>1X2 form</span></div>
    <div class="stat"><b id="s-cs">—</b><span>Score form</span></div>
    <div class="stat" id="s-roi-tile"><b id="s-roi">—</b><span>Hold-out ROI</span></div>
  </div>
  <div class="chips" id="cut"></div>
  <h2 class="lab-h" id="pickhead">Best leans</h2>
  <div id="out"><div class="skel"></div><div class="skel"></div></div>
  <p class="note" id="note"></p>
</main>
<script src="/js/core.js"></script>
<script>
(function () {
  var V = window.VFS;
  V.injectChrome("finder");

  function pct(x) {
    if (x == null || !isFinite(x)) return "—";
    return (x * 100).toFixed(0) + "%";
  }
  function form(t) {
    if (!t || !t.n) return "—";
    return t.wins + "/" + t.n;
  }
  function odds(v) {
    if (v == null || !isFinite(Number(v))) return "—";
    return Number(v).toFixed(2);
  }
  function onSlip(id, sel) {
    return V.loadBook().some(function (l) { return l.id === id && l.selection === sel; });
  }
  function csPrice(g, sel) {
    if (!sel) return null;
    var m = g.cs || {};
    var v = m[sel] != null ? m[sel] : m[String(sel).replace(":", "-")];
    v = Number(v);
    return isFinite(v) && v > 1 ? v : null;
  }

  function side(name, away) {
    var box = V.el("div", "fx-side" + (away ? " away" : ""));
    box.appendChild(V.crest(name));
    box.appendChild(V.el("b", null, name || "—"));
    return box;
  }

  function meet(g) {
    var box = V.el("div", "fx-meet");
    box.appendChild(side(g.home, false));
    box.appendChild(V.el("span", "fx-vs", "VS"));
    box.appendChild(side(g.away, true));
    var wrap = V.el("div", "fx-head");
    wrap.appendChild(box);
    var t = V.until(g.kickoff);
    var when = V.el("time", "fx-when " + t.cls, (t.text || V.clock(g.kickoff) || "").trim() || V.clock(g.kickoff));
    when.setAttribute("data-kick", String(g.kickoff || ""));
    wrap.appendChild(when);
    return wrap;
  }

  function cell(g, item, featured) {
    var price = item.price != null ? Number(item.price) : null;
    if (!(price > 1)) price = null;
    var el = V.el("button", "fx-cell" + (featured ? " pick" : "") + (onSlip(g.id, item.selection) ? " on" : "") + (price ? " tap" : ""));
    el.type = "button";
    el.setAttribute("data-sel", item.selection);
    el.appendChild(V.el("b", null, odds(price)));
    el.appendChild(V.el("span", null, item.label));
    el.appendChild(V.el("em", null, pct(item.p)));
    if (price) {
      el.addEventListener("click", function () {
        V.toggleBook(V.makePick(g, item.selection, price, item.label));
        V.paintSlip();
        var card = el.closest(".finder-card");
        if (card) card.querySelectorAll(".fx-cell").forEach(function (n) {
          n.classList.toggle("on", onSlip(g.id, n.getAttribute("data-sel")));
        });
      });
    }
    return el;
  }

  function block(title, items, g, featuredSel, cols) {
    var box = V.el("section", "fx-block");
    box.appendChild(V.el("h3", "fx-h", title));
    var grid = V.el("div", "fx-g" + (cols === 3 ? " three" : ""));
    items.forEach(function (item) {
      grid.appendChild(cell(g, item, item.selection === featuredSel));
    });
    box.appendChild(grid);
    return box;
  }

  function headlineOf(g) {
    var best = null;
    (g.lines || []).forEach(function (l) {
      if (l.p == null || !isFinite(l.p)) return;
      if (!best || l.p > best.p) best = l;
    });
    return best;
  }

  function card(g, rank) {
    var box = V.el("article", "game finder-card");
    var head = V.el("div", "fx-rank");
    head.appendChild(V.el("span", "idx", String(rank)));
    var hl = headlineOf(g);
    if (hl) {
      var lead = V.el("div", "fx-lead");
      lead.appendChild(V.el("b", null, pct(hl.p)));
      lead.appendChild(V.el("span", null, hl.label));
      if (hl.price) lead.appendChild(V.el("em", null, "@ " + odds(hl.price)));
      head.appendChild(lead);
    }
    box.appendChild(head);
    box.appendChild(meet(g));

    var csItems = [];
    var seen = {};
    function addCs(sel, p, price) {
      if (!sel || sel === "Other" || seen[sel]) return;
      seen[sel] = 1;
      csItems.push({
        selection: sel,
        label: String(sel).replace(":", "-"),
        p: p,
        price: price != null ? price : csPrice(g, sel)
      });
    }
    addCs(g.topCs, g.pCs, csPrice(g, g.topCs));
    (g.csTop || []).forEach(function (c) { addCs(c.selection, c.p, c.price); });
    if (csItems.length % 2) csItems.pop();
    box.appendChild(block("Correct score", csItems.slice(0, 6), g, g.topCs, 2));

    var wx = (g.lines || []).filter(function (l) { return l.selection === "1" || l.selection === "X" || l.selection === "2"; });
    box.appendChild(block("1X2", wx, g, g.pred1x2, 3));

    var dc = (g.lines || []).filter(function (l) { return l.selection === "1X" || l.selection === "X2" || l.selection === "12"; });
    box.appendChild(block("Double chance", dc, g, null, 3));

    return box;
  }

  var LAST = null;
  var CUTS = [0.70, 0.80, 0.85, 0.90];
  var CUT = 0.80;
  try { var savedCut = Number(localStorage.getItem("vfs_finder_cut")); if (CUTS.indexOf(savedCut) >= 0) CUT = savedCut; } catch (e) {}

  function paintCuts() {
    var box = document.getElementById("cut");
    box.textContent = "";
    CUTS.forEach(function (c) {
      var b = V.el("button", "chip" + (CUT === c ? " on" : ""), (c * 100).toFixed(0) + "%+");
      b.type = "button";
      b.addEventListener("click", function () {
        CUT = c;
        try { localStorage.setItem("vfs_finder_cut", String(c)); } catch (e) {}
        paintCuts(); render();
      });
      box.appendChild(b);
    });
  }

  function render() {
    var out = document.getElementById("out");
    out.textContent = "";
    var all = (LAST && LAST.picks) || [];
    var kept = all.map(function (g) { return { g: g, h: headlineOf(g) }; })
      .filter(function (x) { return x.h && x.h.p >= CUT; })
      .sort(function (a, b) { return b.h.p - a.h.p; });

    if (!all.length) {
      out.appendChild(V.el("div", "empty", "No upcoming games to forecast yet."));
    } else if (!kept.length) {
      out.appendChild(V.el("div", "empty", "Nothing clears " + pct(CUT) + " on the card right now — lower the cut."));
    } else {
      kept.forEach(function (x, i) { out.appendChild(card(x.g, i + 1)); });
    }
    document.getElementById("pickhead").textContent = "Best leans — " + kept.length + " of " + all.length;
    document.getElementById("note").textContent =
      (LAST && LAST.nGames || 0) + " settled in memory · showing " + kept.length + " at " + pct(CUT) +
      "+ · the model's read, not a promise. Tap a line to add it.";
    V.tick();
  }

  V.fetchFinder().then(function (d) {
    LAST = d;
    var f = d.form || {};
    var h = d.holdout || {};
    document.getElementById("stats").hidden = false;
    document.getElementById("s-wx").textContent = form(f.wx || h.wx);
    document.getElementById("s-cs").textContent = form(f.cs || h.cs);
    document.getElementById("s-roi").textContent = h.n ? ((h.roi >= 0 ? "+" : "") + (h.roi * 100).toFixed(1) + "%") : "—";
    document.getElementById("s-roi-tile").className = "stat" + (h.roi > 0 ? " go" : h.roi < 0 ? " bad" : "");
    paintCuts();
    render();
  }).catch(function (e) {
    document.getElementById("out").textContent = "";
    document.getElementById("out").appendChild(V.el("div", "empty", e.message));
  });
})();
</script>
</body>
</html>
