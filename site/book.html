<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Book · Vantage</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css?v=20261011d">
<style>
  .odds-meter { margin: 10px 0 12px; padding: 12px 14px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow) }
  .odds-meter b { display: block; font-size: 15px; font-weight: 700 }
  .odds-meter .bar { height: 7px; border-radius: 999px; background: var(--bg); margin: 8px 0; overflow: hidden }
  .odds-meter .bar > i { display: block; height: 100% }
  .odds-meter.ok b, .odds-meter.ok .bar > i { color: var(--go); background-color: var(--go) }
  .odds-meter.mid b { color: var(--hold) } .odds-meter.mid .bar > i { background: var(--hold) }
  .odds-meter.low b { color: var(--bad) } .odds-meter.low .bar > i { background: var(--bad) }
  .odds-meter b { background: none !important }
  .odds-meter p { margin: 0; font-size: 12.5px; color: var(--dim) }
</style>
</head>
<body>
<main class="wrap">
  <p class="lede">Tap prices on Matches or Football.com, then book here. The code loads on that site only — SportyBet codes do not open on Football.com.</p>

  <section id="draft"></section>
  <h2 class="slips-h" id="slips-h">Live & open slips <span class="n" hidden></span></h2>
  <p class="lede" style="margin-bottom:8px">Scores update while they play. Once a slip is settled it moves to <a href="/ledger">History</a>.</p>
  <div id="slips">
    <div class="skel"></div>
  </div>
</main>
<script src="/js/core.js?v=20261011d"></script>
<script>
(function () {
  var V = window.VFS;
  V.injectChrome("book");
  var stake = 100;
  var pay = { football: "money", sporty: "money" };
  var giftId = { football: "", sporty: "" };
  var acct = { football: { connected: false }, sporty: { connected: false } };
  try {
    var s = parseFloat(localStorage.getItem("vfs_stake"));
    if (isFinite(s) && s > 0) stake = s;
    var savedPay = localStorage.getItem("vfs_pay");
    if (savedPay === "gift" || savedPay === "money") pay.football = savedPay;
    var savedSb = localStorage.getItem("vfs_pay_sb");
    if (savedSb === "gift" || savedSb === "money") pay.sporty = savedSb;
  } catch (e) {}

  function naira(n) {
    return "₦" + Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  function leftText(ms) {
    var h = Math.max(0, Math.floor(ms / 3600000));
    var m = Math.max(0, Math.floor((ms % 3600000) / 60000));
    if (h >= 1) return h + "h " + m + "m left";
    return m + "m left";
  }

  function loadAcct(which) {
    var books = which ? [which] : ["football", "sporty"];
    return Promise.all(books.map(function (key) {
      var q = key === "sporty" ? "sporty" : "1";
      return fetch("/api/slips?account=" + q).then(function (r) { return r.json(); }).then(function (d) {
        acct[key] = d && d.ok !== false ? d : { connected: false, error: d && d.error };
        if (acct[key].gifts && acct[key].gifts.length && !giftId[key]) giftId[key] = acct[key].gifts[0].id;
      }).catch(function () {});
    })).then(function () { renderDraft(); });
  }

  function renderDraft() {
    var box = document.getElementById("draft");
    box.textContent = "";
    var sporty = V.loadBook();
    var foot = V.loadBookFc();
    if (!sporty.length && !foot.length) {
      var empty = V.el("div", "empty");
      empty.innerHTML = "<b>Slip is empty.</b><br>On Football.com, tap Home or Draw or Draw or Away.";
      box.appendChild(empty);
      return;
    }
    if (foot.length) paintSlip(box, foot, "football", "Football.com", function (legs) { V.saveBookFc(legs); });
    if (sporty.length) paintSlip(box, sporty, "", "SportyBet", function (legs) { V.saveBook(legs); });
  }

  function accountBox(key, name) {
    var site = acct[key] || { connected: false };
    var q = key === "sporty" ? "sporty" : "1";
    var box = V.el("div", "acct");
    if (site.connected) {
      var line = V.el("div", "row1");
      line.appendChild(V.el("b", null, site.phone || name));
      line.appendChild(V.el("span", "sel", leftText(site.remainingMs || 0)));
      box.appendChild(line);
      var bits = [];
      if (site.balance != null) bits.push("Money " + naira(site.balance));
      bits.push((site.gifts || []).length + " gift" + ((site.gifts || []).length === 1 ? "" : "s"));
      box.appendChild(V.el("p", "note", bits.join(" · ") + ". Signs out on its own after one day."));
      var out = V.el("button", "rm", "Sign out now");
      out.addEventListener("click", function () {
        fetch("/api/slips?account=" + q, { method: "DELETE" }).then(function () {
          acct[key] = { connected: false };
          renderDraft();
        });
      });
      box.appendChild(out);
      return box;
    }
    box.appendChild(V.el("b", null, name + " account"));
    box.appendChild(V.el("p", "note", "Used only to place this slip. The password is not saved. The login ends after one day."));
    var phone = document.createElement("input");
    phone.type = "tel"; phone.placeholder = "Phone, 080…"; phone.autocomplete = "username";
    phone.style.marginBottom = "8px";
    var pass = document.createElement("input");
    pass.type = "password"; pass.placeholder = "Password"; pass.autocomplete = "current-password";
    box.appendChild(phone);
    box.appendChild(pass);
    var go = V.el("button", "primary", "Connect");
    go.style.marginTop = "8px";
    go.addEventListener("click", function () {
      go.disabled = true;
      go.textContent = "Connecting…";
      fetch("/api/slips?account=" + q, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ phone: phone.value, password: pass.value })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (!d.ok || !d.connected) throw new Error(d.error || "Could not connect");
        pass.value = "";
        acct[key] = d;
        if (acct[key].gifts && acct[key].gifts.length) giftId[key] = acct[key].gifts[0].id;
        renderDraft();
      }).catch(function (e) {
        go.disabled = false;
        go.textContent = e.message;
      });
    });
    box.appendChild(go);
    return box;
  }

  function legBody(legs, book) {
    return legs.map(function (l) {
      return {
        gameId: l.id, eventId: l.eventId, selection: l.selection,
        home: l.home, away: l.away, league: l.league,
        price: l.price, kickoff: l.kickoff, label: l.label || "",
        source: book === "football" ? "football" : "",
        sport: l.sport || "",
        marketId: l.marketId || null,
        outcomeId: l.outcomeId || null,
        specifier: l.specifier || "",
        probability: l.probability || "",
        tag: l.tag || null,
        chance: l.chance == null ? null : l.chance
      };
    });
  }

  function sendSlip(legs, book, extra) {
    return fetch("/api/slips", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        stake: stake,
        book: book,
        pay: extra && extra.pay || "",
        giftId: extra && extra.giftId || "",
        legs: legBody(legs, book)
      })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.error || "Could not book");
      return d;
    });
  }

  var priceNote = "";
  function refreshPrices() {
    var jobs = [];
    var sporty = V.loadBook();
    var foot = V.loadBookFc();
    if (sporty.length) jobs.push({ book: "sporty", legs: sporty, save: V.saveBook });
    if (foot.length) jobs.push({ book: "football", legs: foot, save: V.saveBookFc });
    if (!jobs.length) return Promise.resolve();
    return Promise.all(jobs.map(function (j) {
      return fetch("/api/slips", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ quote: true, book: j.book, legs: legBody(j.legs, j.book) })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (!d || !d.ok) throw new Error((d && d.error) || "Could not refresh prices");
        var bits = [];
        var next = j.legs.map(function (l, i) {
          var q = (d.legs || [])[i] || {};
          if (q.error) {
            bits.push((l.home || "Game") + " is suspended");
            return Object.assign({}, l, { blocked: q.error });
          }
          if (l.outcomeId && q.outcomeId && String(q.outcomeId) !== String(l.outcomeId)) {
            bits.push((l.home || "Game") + " is not the price you tapped");
            return Object.assign({}, l, { blocked: "Not the price you tapped" });
          }
          if (!(Number(q.price) > 1)) return Object.assign({}, l, { blocked: "" });
          if (Math.abs(Number(q.price) - Number(l.price)) >= 0.01) {
            bits.push((l.home || "Game") + " " + Number(l.price).toFixed(2) + " → " + Number(q.price).toFixed(2));
          }
          return Object.assign({}, l, {
            price: q.price,
            marketId: q.marketId || l.marketId,
            outcomeId: q.outcomeId || l.outcomeId,
            specifier: q.specifier || "",
            probability: q.probability || l.probability || "",
            blocked: ""
          });
        });
        j.save(next);
        return bits;
      });
    })).then(function (all) {
      var bits = [];
      all.forEach(function (b) { if (b) bits = bits.concat(b); });
      priceNote = bits.length ? bits.join(" · ") : "Prices are current.";
      renderDraft();
    }).catch(function (e) {
      priceNote = e.message || "Could not refresh prices";
      renderDraft();
    });
  }

  // Chance every leg wins. A leg's own stats % when the page gave one, else
  // SportyBet's price with its ~8.5% margin taken out.
  function legChance(l) {
    var c = Number(l.chance);
    if (isFinite(c) && c > 0 && c < 1) return { p: c, src: "stats" };
    var pr = Number(l.price);
    if (!(pr > 1)) return null;
    return { p: Math.min(0.97, 1 / pr / 1.085), src: "price" };
  }
  function slipChance(legs) {
    var box = V.el("div", "odds-meter");
    var rows = legs.map(function (l) { return { l: l, c: legChance(l) }; }).filter(function (x) { return x.c; });
    if (!rows.length) return box;
    var all = rows.reduce(function (a, x) { return a * x.c.p; }, 1);
    var pct = Math.round(all * 1000) / 10;
    box.className = "odds-meter " + (all >= 0.5 ? "ok" : all >= 0.25 ? "mid" : "low");
    var oneIn = all > 0 ? Math.max(1, Math.round(1 / all)) : 0;
    box.appendChild(V.el("b", null, "Chance this slip wins: " + pct + "%" + (oneIn > 1 ? " · about 1 in " + oneIn : "")));
    var bar = V.el("div", "bar"); var fill = V.el("i"); fill.style.width = Math.max(2, Math.min(100, all * 100)) + "%";
    bar.appendChild(fill); box.appendChild(bar);
    var weakest = rows.slice().sort(function (a, b) { return a.c.p - b.c.p; })[0];
    var tips = [];
    if (rows.length > 1) {
      // "Cut by one" is the likeliest way a long slip dies.
      var oneLoss = 0;
      for (var i = 0; i < rows.length; i++) {
        var p = 1;
        for (var j = 0; j < rows.length; j++) p *= (i === j ? 1 - rows[j].c.p : rows[j].c.p);
        oneLoss += p;
      }
      tips.push("Losing by exactly one leg: " + Math.round(oneLoss * 100) + "%.");
    }
    tips.push("Weakest leg: " + weakest.l.home + " v " + weakest.l.away + " (" + Math.round(weakest.c.p * 100) + "%" + (weakest.c.src === "price" ? " from the price" : "") + ").");
    if (all < 0.25) tips.push("Each extra leg cuts this down — 2 or 3 Strong legs keep it near even.");
    box.appendChild(V.el("p", null, tips.join(" ")));
    return box;
  }

  function paintSlip(box, legs, book, name, save) {
    box.appendChild(V.el("h2", "slips-h", name));
    var key = book === "football" ? "football" : "sporty";
    var site = acct[key] || { connected: false };
    box.appendChild(accountBox(key, name));
    var odds = V.acca(legs.map(function (l) { return l.price; }));
    var ret = Math.round(stake * odds * 100) / 100;
    legs.forEach(function (l, i) {
      var row = V.el("div", "leg");
      var left = V.el("div");
      left.appendChild(V.teamsBlock(l.home, l.away));
      left.appendChild(V.el("div", "sel", l.label + " · " + Number(l.price).toFixed(2) +
        (l.blocked ? " · suspended" : "") +
        (l.kickoff ? " · " + V.clock(l.kickoff) : "")));
      row.appendChild(left);
      var rm = V.el("button", "rm", "Remove");
      rm.addEventListener("click", function () {
        save(legs.filter(function (_, j) { return j !== i; }));
        renderDraft();
      });
      row.appendChild(rm);
      box.appendChild(row);
    });

    box.appendChild(slipChance(legs));

    var ref = V.el("button", "ghost wide", "Refresh prices");
    ref.type = "button";
    ref.addEventListener("click", function () {
      ref.disabled = true;
      ref.textContent = "Refreshing…";
      refreshPrices();
    });
    box.appendChild(ref);
    if (priceNote) box.appendChild(V.el("p", "note", priceNote));

    var cut = legs.filter(function (l) {
      return l.kickoff && Number(l.kickoff) < Date.now() - 60000;
    });
    if (cut.length) {
      var wipe = V.el("button", "ghost wide", "Clear " + cut.length + " that already started");
      wipe.type = "button";
      wipe.addEventListener("click", function () {
        save(legs.filter(function (l) {
          return !(l.kickoff && Number(l.kickoff) < Date.now() - 60000);
        }));
        renderDraft();
      });
      box.appendChild(wipe);
    }
    var money = V.el("div", "money");
    var a = V.el("div");
    a.appendChild(V.el("label", null, "Stake"));
    var inp = document.createElement("input");
    inp.type = "number"; inp.min = "1"; inp.step = "1"; inp.value = String(stake);
    inp.addEventListener("change", function () {
      var v = parseFloat(inp.value);
      if (isFinite(v) && v > 0) {
        stake = v;
        try { localStorage.setItem("vfs_stake", String(stake)); } catch (e) {}
      }
      inp.value = String(stake);
      renderDraft();
    });
    a.appendChild(inp);
    var b = V.el("div");
    b.appendChild(V.el("label", null, "To return"));
    b.appendChild(V.el("div", "read", naira(ret) + "  @ " + odds.toFixed(2)));
    money.appendChild(a); money.appendChild(b);
    box.appendChild(money);

    var picks = V.el("div", "paypick");
      ["money", "gift"].forEach(function (kind) {
        var btn = V.el("button", "chip" + (pay[key] === kind ? " on" : ""), kind === "money" ? "Money" : "Gift");
        btn.type = "button";
        btn.addEventListener("click", function () {
          pay[key] = kind;
          try { localStorage.setItem(key === "sporty" ? "vfs_pay_sb" : "vfs_pay", pay[key]); } catch (e) {}
          renderDraft();
        });
        picks.appendChild(btn);
      });
      box.appendChild(picks);
      if (pay[key] === "gift") {
        var gifts = (site.gifts || []);
        if (!gifts.length) {
          box.appendChild(V.el("p", "note", site.connected ? "No gift on this account." : "Connect to see gifts."));
        } else {
          var sel = document.createElement("select");
          sel.style.width = "100%";
          sel.style.minHeight = "44px";
          sel.style.marginBottom = "12px";
          gifts.forEach(function (g) {
            var o = document.createElement("option");
            o.value = g.id;
            o.textContent = g.name + " · " + naira(g.amount);
            if (g.id === giftId[key]) o.selected = true;
            sel.appendChild(o);
          });
          giftId[key] = sel.value;
          sel.addEventListener("change", function () { giftId[key] = sel.value; });
          box.appendChild(sel);
        }
      }
      var blocked = legs.filter(function (l) { return l.blocked; });
      var go = V.el("button", "primary", blocked.length ? (blocked.length + " suspended — take them off") : (site.connected ? ("Place " + naira(stake) + " · " + pay[key]) : ("Connect " + name + " to place")));
      go.disabled = !site.connected || blocked.length || (pay[key] === "gift" && !(site.gifts || []).length);
      go.addEventListener("click", function () {
        go.disabled = true;
        go.textContent = "Placing…";
        sendSlip(legs, book, { pay: pay[key], giftId: giftId[key] }).then(function (d) {
          save([]);
          renderDraft();
          loadSlips();
          loadAcct(key);
          if (d.slip && d.slip.orderId) {
            try { navigator.clipboard.writeText(d.slip.orderId); } catch (e) {}
          }
        }).catch(function (e) {
          go.disabled = false;
          go.textContent = e.message;
        });
      });
      box.appendChild(go);
      var linkOnly = V.el("button", "ghost wide", blocked.length ? "Take the suspended ones off first" : "Load link only — no stake");
      linkOnly.type = "button";
      linkOnly.disabled = blocked.length > 0;
      linkOnly.addEventListener("click", function () {
        linkOnly.disabled = true;
        linkOnly.textContent = "Asking " + name + "…";
        sendSlip(legs, book, {}).then(function (d) {
          save([]);
          renderDraft();
          loadSlips();
          if (d.slip && d.slip.shareCode) {
            try { navigator.clipboard.writeText(d.slip.shareCode); } catch (e) {}
          }
        }).catch(function (e) {
          linkOnly.disabled = false;
          linkOnly.textContent = e.message;
        });
      });
      box.appendChild(linkOnly);
      box.appendChild(V.el("p", "note", "Place sends the stake to your " + name + " balance or gift. Load link only makes a code and does not stake."));
  }

  function badge(status) {
    return V.el("span", "badge " + status, status);
  }

  function renderSlips(slips) {
    var box = document.getElementById("slips");
    box.textContent = "";
    var active = (slips || []).filter(function (s) {
      return s.status === "open" || s.status === "live";
    });
    // Live bets ride to the top; open ones keep their newest-first order below.
    active.sort(function (a, b) {
      return (a.status === "live" ? 0 : 1) - (b.status === "live" ? 0 : 1);
    });
    var liveN = active.filter(function (s) { return s.status === "live"; }).length;
    var openN = active.length - liveN;
    var h = document.getElementById("slips-h");
    var n = h && h.querySelector(".n");
    if (n) {
      n.hidden = false;
      n.textContent = String(active.length);
      n.className = "n" + (liveN ? " live" : openN ? " open" : "");
    }
    if (!active.length) {
      var e = V.el("div", "empty");
      e.innerHTML = "No live or open slips.<br>Finished ones are on <a href=\"/ledger\">History</a>.";
      box.appendChild(e);
      return;
    }
    active.forEach(function (sp) { box.appendChild(V.slipCard(sp)); });
  }

  function loadSlips(live) {
    V.fetchSlips(live).then(function (d) {
      renderSlips(d.slips || []);
      V.noticeSlips(d.slips || []);
    })
      .catch(function (e) {
        document.getElementById("slips").innerHTML = '<p class="err">' + e.message + "</p>";
      });
  }

  renderDraft();
  loadAcct();
  refreshPrices();
  window.addEventListener("vfs-book", renderDraft);
  window.addEventListener("vfs-slips", function () { loadSlips(false); });
  loadSlips(false);
  loadSlips(true);
  setInterval(function () { loadSlips(true); }, 60000);
})();
</script>
</body>
</html>
