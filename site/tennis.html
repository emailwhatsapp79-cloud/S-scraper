<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E12">
<title>Tennis · Vantage</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css?v=20261011f">
<style>
  .seg { display: inline-flex; background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 3px; gap: 3px; margin-bottom: 12px }
  .seg a, .seg button { border: 0; background: transparent; color: var(--dim); font: inherit; font-weight: 600; font-size: 13px; padding: 6px 14px; border-radius: 999px; text-decoration: none; cursor: pointer }
  .seg a.on, .seg button.on { background: var(--bg); color: var(--ink) }
  .tn { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; align-items: start; background: var(--card); box-shadow: var(--shadow); border-radius: var(--r); margin-bottom: 10px; padding: 13px 14px }
  .tn-num { grid-row: 1 / -1; min-width: 22px; height: 22px; margin-top: 1px; display: inline-grid; place-items: center; padding: 0 6px; border-radius: 999px; background: var(--go-dim); color: var(--go); font-family: var(--mono); font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums }
  .tn > :not(.tn-num) { grid-column: 2 }
  .tn-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px }
  .tn-tourn { flex: 1; min-width: 0; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); font-weight: 600 }
  .tn-when { margin-left: auto; font-family: var(--mono); font-size: 12.5px; color: var(--dim) }
  .tn-stats { font-size: 12.5px; color: var(--dim); margin: -4px 0 10px }
  .tn-stats b { color: var(--ink); font-weight: 650 }
  .tn-call { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 4px 0 10px; font-size: 13.5px }
  .tn-call b { font-weight: 700 }
  .tn-call span { color: var(--dim) }
  .tn-pl { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-bottom: 6px }
  .tn-pl b { font-size: 15.5px; font-weight: 650 }
  .tn-pl.on b { color: var(--go) }
  .tn-note { font-size: 12.5px; color: var(--hold); margin: -4px 0 8px }
  .tn-note.bad { color: var(--bad) }
  .tn-dots { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--dim) }
  .tn-dots i { font-style: normal; color: var(--faint); margin-right: 4px }
  .tn-bar { height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; box-shadow: var(--shadow); margin: 2px 0 10px }
  .tn-bar > i { display: block; height: 100%; background: var(--go) }
  .tn-lab { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin: 8px 0 6px }
  .tn-g { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }
  .tn-s { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px }
  .tn-s.three { grid-template-columns: repeat(3, 1fr) }
  .tn-s.six { grid-template-columns: repeat(3, 1fr) }
  .tn-cell { position: relative; background: var(--bg); box-shadow: var(--shadow); border-radius: var(--r3); padding: 8px 4px; text-align: center; cursor: pointer }
  .tn-cell b { display: block; font-family: var(--mono); font-size: 14px; font-weight: 650 }
  .tn-cell span { display: block; font-size: 10.5px; color: var(--dim); margin-top: 2px }
  .tn-cell em { display: block; font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--go); margin-top: 1px }
  .tn-cell.book { box-shadow: inset 0 0 0 1px var(--go), var(--shadow) }
  .tn-cell.ahead, .tn-cell.call { box-shadow: inset 0 0 0 1px var(--hold), var(--shadow) }
  .tn-cell.ahead b, .tn-cell.ahead em, .tn-cell.call b, .tn-cell.call em { color: var(--hold) }
  .tn-tag { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); background: var(--hold); color: #1a1408; font-style: normal; font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; line-height: 1; padding: 2px 5px; border-radius: 99px; white-space: nowrap }
  .tn-tag.book { background: var(--go); color: var(--go-ink) }
  .tn-cell.on { background: var(--go); color: var(--go-ink) }
  .tn-cell.on span, .tn-cell.on em, .tn-cell.on b { color: var(--go-ink) }
  .tn-hit, .tn-miss { margin-left: auto; font-family: var(--mono); font-size: 12.5px }
  .tn-hit { color: var(--go) }
  .tn-miss { color: var(--bad) }
  .tn.sim { box-shadow: inset 0 0 0 1px var(--bad) }
  .tn-sim { color: var(--bad); font-size: 10px; font-weight: 700; letter-spacing: .06em; border: 1px solid var(--bad); border-radius: 99px; padding: 1px 6px }
  .tn-susp { color: var(--hold); font-size: 10px; font-weight: 700; letter-spacing: .06em; border: 1px solid var(--hold); border-radius: 99px; padding: 1px 6px }
  .tn-cell.off { cursor: default; opacity: .45 }
  .tn-w, .tn-draw { color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .06em; border: 1px solid var(--dim); border-radius: 99px; padding: 1px 6px }
  .tn-slip { background: var(--card); box-shadow: var(--shadow); border-radius: var(--r); margin: 0 0 14px; padding: 12px 12px 4px }
  .tn-slip-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px }
  .tn-slip-h b { font-size: 15px; font-weight: 700 }
  .tn-slip-h .tn-when { margin-left: auto }
  .tn-slip .tn { background: var(--bg); box-shadow: none; margin-bottom: 8px }
</style>
</head>
<body>
<main class="wrap">
  <div class="chips" id="views">
    <button type="button" class="chip on" id="v-matches">Matches</button>
    <button type="button" class="chip" id="v-book">Book + stats</button>
    <button type="button" class="chip" id="v-record">Record</button>
  </div>
  <div class="chips" id="tourns"></div>
  <h2 class="lab-h" id="head">Upcoming</h2>
  <div id="out"><div class="skel"></div><div class="skel"></div></div>
</main>
<script src="/js/core.js?v=20261011f"></script>
<script>
(function () {
  var V = window.VFS;
  V.injectChrome("tennis");
  var LAST = [], LEAGUE = "All", VIEW = "matches", ONLY = "", STR = "", RECORD = null, BOOKED = null, BOOKS = [], REC = "score", WHEN = "wait";

  // "Cerundolo, Francisco" -> Cerundolo; "Stevens B" -> Stevens;
  // a doubles pair "Krawietz K / Puetz T" -> Krawietz / Puetz.
  function lastName(s) {
    var t = String(s || "").trim();
    if (t.indexOf("/") >= 0) return t.split("/").map(lastName).join(" / ");
    if (t.indexOf(",") >= 0) return t.split(",")[0].trim();
    var p = t.split(/\s+/).filter(function (w) { return !/^[A-Z]\.?$/.test(w); });
    return p[p.length - 1] || t;
  }
  function pct(n) { return (n == null || !isFinite(n)) ? "—" : Math.round(n) + "%"; }
  function current(g) {
    var legs = V.loadBook();
    for (var i = 0; i < legs.length; i++) {
      if (g.eventId && legs[i].eventId === g.eventId) return legs[i].selection;
      if (legs[i].id === g.id) return legs[i].selection;
    }
    return null;
  }
  function gameOf(g) {
    // The tag the card shows belongs to the called side; the other side is
    // "against". Set-score picks take the tag of the side they favour.
    var tags = null;
    var side = statSide(g);
    if (side && !g.sim) {
      var lvl = levelOf(g) || "none";
      var homeTag = side === "away" ? "against" : lvl;
      var awayTag = side === "away" ? lvl : "against";
      tags = { "1": homeTag, "2": awayTag, "2:0": homeTag, "2:1": homeTag, "1:2": awayTag, "0:2": awayTag };
    }
    return {
      id: g.id, eventId: g.eventId, home: g.home, away: g.away,
      league: g.tourn || "Tennis", kickoff: g.start || null,
      sport: "tn", selectionRefs: g.selectionRefs || {}, tags: tags
    };
  }
  function cell(g, sel, price, label, kind, extra) {
    var on = current(g) === sel;
    var c = V.el("div", "tn-cell" + (on ? " on" : kind ? " " + kind : ""));
    if ((kind === "ahead" || kind === "book" || kind === "call") && !on) {
      var word = kind === "book" ? "book" : (kind === "call" ? "call" : "ahead");
      c.appendChild(V.el("i", "tn-tag" + (kind === "book" ? " book" : ""), word));
    }
    c.appendChild(V.el("b", null, price != null ? Number(price).toFixed(2) : label));
    c.appendChild(V.el("span", null, label));
    if (extra) c.appendChild(V.el("em", null, extra));
    var score = /^\d+:\d+$/.test(sel);
    var closed = g.suspended || (score ? g.scoresOpen === false : g.winOpen === false) ||
      (V.heldNow ? V.heldNow({ id: g.id, eventId: g.eventId }) : false);
    // Suspended on SportyBet: can't be added, only taken off if already on the slip.
    var bookable = price != null && g.selectionRefs && g.selectionRefs[sel] && (!closed || on);
    if (!bookable) c.classList.add("off");
    if (bookable) {
      c.addEventListener("click", function (e) {
        e.stopPropagation();
        (V.bookChecked || V.toggleBook)(V.makePick(gameOf(g), sel, price, label));
        render();
      });
    }
    return c;
  }
  // Strong / Good on our winner, with the book's favourite the same player.
  // Tags come from player stats only (rating, form, games won, head-to-head,
  // rest, career — fitted on SportyBet's own results), never the price.
  var LEVELS = { strong: 80, good: 75, lean: 70 };
  function statSide(g) { return g.stats ? (g.stats.home >= g.stats.away ? "home" : "away") : null; }
  function levelOf(g) {
    if (!g.stats || g.sim || isDoubles(g)) return null;
    var top = Math.max(g.stats.home, g.stats.away);
    return top >= LEVELS.strong ? "strong" : top >= LEVELS.good ? "good" : top >= LEVELS.lean ? "lean" : null;
  }
  function sbPct(g, side) {
    var h = Number(g.win && g.win.home), a = Number(g.win && g.win.away);
    if (!(h > 1) || !(a > 1)) return null;
    var ph = (1 / h) / (1 / h + 1 / a);
    return Math.round(100 * (side === "away" ? 1 - ph : ph));
  }

  // One bad game must never blank the whole list: draw a plain card instead,
  // with the error so a screenshot says what broke.
  function safeCard(g, n) {
    try { return card(g, n); } catch (e) {
      var box = V.el("article", "tn");
      box.appendChild(V.el("span", "tn-num", String(n)));
      var lvl = null;
      try { lvl = levelOf(g); } catch (x) {}
      var top = V.el("div", "tn-top");
      if (lvl) top.appendChild(V.strengthTag(lvl));
      top.appendChild(V.el("span", "tn-tourn", g.tourn || "Tennis"));
      box.appendChild(top);
      box.appendChild(V.el("div", "tn-call", (g.home || "?") + " vs " + (g.away || "?")));
      if (g.stats) box.appendChild(V.el("div", "tn-stats", "Stats: " + g.stats.home + "% / " + g.stats.away + "%"));
      if (g.win) {
        var wg = V.el("div", "tn-g");
        try {
          wg.appendChild(cell(g, "1", g.win.home, lastName(g.home), false, ""));
          wg.appendChild(cell(g, "2", g.win.away, lastName(g.away), false, ""));
        } catch (x) {}
        box.appendChild(wg);
      }
      box.appendChild(V.el("div", "tn-note bad", "Display error: " + (e && e.message ? e.message : String(e))));
      return box;
    }
  }
  function card(g, n) {
    var box = V.el("article", "tn");
    box.appendChild(V.el("span", "tn-num", String(n)));
    var top = V.el("div", "tn-top");
    if (g.women) top.appendChild(V.el("b", "tn-w", "W"));
    if (g.draw === "doubles") top.appendChild(V.el("b", "tn-draw", "Doubles"));
    else if (g.draw === "singles") top.appendChild(V.el("b", "tn-draw", "Singles"));
    if (g.sim) {
      box.className = "tn sim";
      top.appendChild(V.el("b", "tn-sim", "SIM"));
    }
    if (g.suspended) top.appendChild(V.el("b", "tn-susp", "Suspended"));
    var lvl = levelOf(g);
    if (lvl) top.appendChild(V.strengthTag(lvl));
    top.appendChild(V.el("span", "tn-tourn", g.tourn || "Tennis"));
    var t = V.until(g.start);
    var when = V.el("time", "tn-when", (t.text || V.clock(g.start) || "").trim() || V.clock(g.start));
    when.setAttribute("data-kick", String(g.start || ""));
    top.appendChild(when);
    box.appendChild(top);

    if (g.sim) {
      box.appendChild(V.el("div", "tn-note bad", "Simulated. Not a real match. Real player form does not count."));
      [["", g.home], ["", g.away]].forEach(function (p) {
        var row = V.el("div", "tn-pl");
        row.appendChild(V.el("b", null, p[1]));
        box.appendChild(row);
      });
      return box;
    }
    var call = g.call || {};
    var winner = call.side === "away" ? g.away : g.home;
    var line = V.el("div", "tn-call");
    line.appendChild(V.el("b", null, lastName(winner)));
    var winPct = call.side === "away" ? call.away : call.home;
    var bookPct = g.book ? (call.side === "away" ? g.book.away : g.book.home) : null;
    var was = bookPct != null && Math.abs(bookPct - winPct) >= 1 ? " · book had " + pct(bookPct) : "";
    line.appendChild(V.el("span", null, "wins " + pct(winPct) + was));
    if (call.score) {
      var scoreText = g.ahead
        ? "a little ahead · ours " + pct(g.ahead.ours) + " · book " + pct(g.ahead.book)
        : (g.called
          ? "outside call " + g.called.sel.replace(":", "–")
          : (g.withBook ? "with the book" : "most likely " + pct(call.scoreP) + (g.derived ? " · from the winner price" : "")));
      line.appendChild(V.el("b", null, call.score));
      line.appendChild(V.el("span", null, scoreText));
    }
    box.appendChild(line);
    var ss = statSide(g);
    if (ss) {
      var sl = V.el("div", "tn-stats");
      var who = lastName(ss === "away" ? g.away : g.home);
      var bp = sbPct(g, ss);
      sl.appendChild(V.el("b", null, "Stats: " + who + " " + (ss === "away" ? g.stats.away : g.stats.home) + "%"));
      sl.appendChild(document.createTextNode(
        (bp != null ? " · SportyBet " + bp + "%" : "") +
        " · " + (g.nH || 0) + " / " + (g.nA || 0) + " matches" +
        (g.h2h && g.h2h.n ? " · met " + g.h2h.n + "× (" + g.h2h.hw + "–" + (g.h2h.n - g.h2h.hw) + ")" : "")));
      box.appendChild(sl);
    } else if (!g.sim && !isDoubles(g)) {
      box.appendChild(V.el("div", "tn-stats", "Stats: not enough matches yet (" + (g.nH || 0) + " / " + (g.nA || 0) + ", needs 5 each)"));
    }
    if (g.context && g.context.note) {
      var bad = /out|retired/i.test(g.context.note);
      box.appendChild(V.el("div", "tn-note" + (bad ? " bad" : ""), g.context.note));
    }

    var homeOn = call.side !== "away";
    [["home", g.home, call.home], ["away", g.away, call.away]].forEach(function (p) {
      var row = V.el("div", "tn-pl" + ((p[0] === "home") === homeOn ? " on" : ""));
      row.appendChild(V.el("b", null, p[1]));
      var ctx = g.context && g.context[p[0]];
      var meta = V.el("span", "tn-pct", pct(p[2]) + (ctx && ctx.rank ? " · #" + ctx.rank : ""));
      row.appendChild(meta);
      box.appendChild(row);
      if (ctx && ctx.dots && ctx.dots.length) {
        var dots = V.el("div", "tn-dots");
        var lab = V.el("i", null, "Last");
        dots.appendChild(lab);
        dots.appendChild(document.createTextNode(ctx.dots.join(" ")));
        box.appendChild(dots);
      }
    });
    var bar = V.el("div", "tn-bar");
    var fill = V.el("i");
    fill.style.width = Math.max(4, Math.min(96, call.home || 50)) + "%";
    bar.appendChild(fill);
    box.appendChild(bar);

    if (g.win) {
      box.appendChild(V.el("div", "tn-lab", g.winOpen === false ? "Winner · suspended" : "Winner"));
      var wg = V.el("div", "tn-g");
      wg.appendChild(cell(g, "1", g.win.home, lastName(g.home), false, pct(call.home)));
      wg.appendChild(cell(g, "2", g.win.away, lastName(g.away), false, pct(call.away)));
      box.appendChild(wg);
    }
    var scores = g.scores || [];
    if (scores.length) {
      box.appendChild(V.el("div", "tn-lab", g.derived ? "Set score, estimated" : (g.scoresOpen === false ? "Set score · suspended" : "Set score")));
      var sg = V.el("div", "tn-s" + (scores.length > 4 ? " six" : ""));
      var shortSel = "", shortOdds = 99;
      scores.forEach(function (s) {
        var o = Number(s.odds);
        if (o > 1 && o < shortOdds) { shortOdds = o; shortSel = s.sel; }
      });
      scores.forEach(function (s) {
        var isAhead = g.ahead && s.sel === g.ahead.sel;
        var isCall = !isAhead && g.called && s.sel === g.called.sel;
        var withBook = !isAhead && !isCall && (
          (g.withBook && s.sel === g.withBook.sel) ||
          (!g.context && !g.ahead && !g.called && s.sel === shortSel && shortOdds <= 1.7)
        );
        var kind = isAhead ? "ahead" : (isCall ? "call" : (withBook ? "book" : ""));
        sg.appendChild(cell(g, s.sel, s.odds, s.sel, kind, pct(s.p)));
      });
      box.appendChild(sg);
    }
    return box;
  }

  function bookish() { return ONLY === "book" || ONLY === "ms" || ONLY === "ws"; }
  function isDoubles(g) {
    if (!g) return false;
    if (g.draw === "doubles") return true;
    return /\bdoubles\b/i.test(g.tourn || "") || /\s\/\s/.test((g.home || "") + " " + (g.away || ""));
  }
  function isWoman(g) {
    if (!g) return false;
    if (g.women) return true;
    return /\bWTA\b|\bwomen\b|\bITF\s+W\d+/i.test(g.tourn || "");
  }
  function hasBook(g) {
    if (!g || g.sim || g.ahead || g.called) return false;
    if (g.withBook && g.withBook.sel) return statsAgree(g, /^(2:0|2:1)$/.test(g.withBook.sel) ? "home" : "away");
    if (g.context) return false;
    var short = 99, sel = "";
    (g.scores || []).forEach(function (s) {
      var o = Number(s.odds);
      if (o > 1 && o < short) { short = o; sel = s.sel; }
    });
    if (short > 1.7) return false;
    return statsAgree(g, sel === "2:0" || sel === "2:1" ? "home" : "away");
  }
  // Book + stats agree: SportyBet's short favourite only when our stats also
  // give that player 70%+ on their own record.
  function statsAgree(g, side) {
    if (!g.stats) return false;
    var ours = side === "away" ? g.stats.away : g.stats.home;
    return ours >= LEVELS.lean;
  }

  function tourns(list) {
    var box = document.getElementById("tourns");
    var names = ["All"];
    list.forEach(function (g) { if (g.tourn && names.indexOf(g.tourn) < 0) names.push(g.tourn); });
    box.textContent = "";
    names.forEach(function (n) {
      var b = V.el("button", "chip" + (n === LEAGUE ? " on" : ""), n.length > 28 ? n.slice(0, 26) + "…" : n);
      b.addEventListener("click", function () { LEAGUE = n; render(); });
      box.appendChild(b);
    });
  }

  function verdictLine(r) {
    if (!r || !r.n) return "No ahead score has finished yet. Only the gold one is saved, the first time it shows, bet or not.";
    var line = r.hits + " of " + r.n + " ahead scores landed. We called " + pct(r.avgOurs) + " on average, the book " + pct(r.avgBook) + ".";
    if (r.used === "book") return line + " The book is closer, so the gold box is off.";
    if (r.used === "ours") return line + " Our number is closer, so the gold box stays on.";
    return line + " The gold box stays on until 12 have finished.";
  }

  function countLine(rows, hitKey) {
    var done = rows.filter(function (r) { return r[hitKey] != null; });
    if (!done.length) return "";
    var hits = done.filter(function (r) { return r[hitKey]; }).length;
    return hits + " of " + done.length;
  }
  function renderRecord() {
    var out = document.getElementById("out");
    out.textContent = "";
    document.getElementById("head").textContent = "Record";
    document.getElementById("tourns").textContent = "";
    var tabs = V.el("div", "chips");
    [["score", "Correct score"], ["winner", "Winners"], ["booked", "Booked"]].forEach(function (pair) {
      var b = V.el("button", "chip" + (REC === pair[0] ? " on" : ""), pair[1]);
      b.addEventListener("click", function () { REC = pair[0]; render(); });
      tabs.appendChild(b);
    });
    out.appendChild(tabs);
    var when = V.el("div", "chips");
    [["wait", "Waiting"], ["done", "Finished"]].forEach(function (pair) {
      var b = V.el("button", "chip" + (WHEN === pair[0] ? " on" : ""), pair[1]);
      b.addEventListener("click", function () { WHEN = pair[0]; render(); });
      when.appendChild(b);
    });
    out.appendChild(when);
    if (BOOKED == null && !BOOKS.length) {
      out.appendChild(V.el("div", "empty", "Checking the record…"));
      return;
    }
    if (REC === "booked") {
      var slips = [];
      var legs = [];
      var wipe = V.el("button", "chip", "Delete all");
      wipe.addEventListener("click", function () {
        if (!window.confirm("Delete every booked tennis slip?")) return;
        wipe.disabled = true;
        fetch("/api/slips?tennis=all", { method: "DELETE" }).then(readJson).then(function (d) {
          if (!d || !d.ok) throw new Error((d && d.error) || "Could not delete");
          loadRecord();
        }).catch(function (e) {
          wipe.disabled = false;
          wipe.textContent = e.message;
        });
      });
      out.appendChild(wipe);
      ((BOOKED && BOOKED.slips) || []).forEach(function (slip) {
        var rows = slip.rows || [];
        if (!rows.length) return;
        var open = rows.some(function (r) { return r.hit == null; });
        if (WHEN === "done" ? open : !open) return;
        var card = toSlip(slip, rows, !open);
        slips.push(card);
        legs = legs.concat(card.legs);
      });
      if (WHEN === "wait") slips = liveFirst(slips, slipKick);
      if (WHEN === "done") countTiles(out, legs);
      groupDays(out, slips, function (s) { return s.createdAt || slipKick(s); }, V.slipCard);
      return;
    }
    var stale = Date.now() - 12 * 3600 * 1000;
    var list = BOOKS.filter(function (row) {
      var done = row.scoreHit != null || row.winnerHit != null;
      // A pick that started over 12 hours ago with no result found is not
      // "waiting" any more (often doubles, which the results feed skips).
      if (!done && Number(row.start) && Number(row.start) < stale) return false;
      return WHEN === "done" ? done : !done;
    });
    var picks = list.map(function (row) { return toPick(row, REC, WHEN === "done"); });
    if (WHEN === "wait") picks = liveFirst(picks, function (p) { return p.kickoff; });
    if (WHEN === "done") countTiles(out, picks);
    groupDays(out, picks, function (p) { return p.kickoff; }, V.pickCard);
  }
  function liveFirst(items, kickOf) {
    var now = Date.now();
    return items.slice().sort(function (a, b) {
      var ka = Number(kickOf(a)) || 0;
      var kb = Number(kickOf(b)) || 0;
      var la = ka > 0 && ka <= now ? 0 : 1;
      var lb = kb > 0 && kb <= now ? 0 : 1;
      if (la !== lb) return la - lb;
      return ka - kb;
    });
  }
  function slipKick(s) {
    var now = Date.now();
    var times = (s.legs || []).map(function (l) { return Number(l.kickoff) || 0; }).filter(Boolean);
    var live = times.filter(function (t) { return t <= now; });
    if (live.length) return Math.min.apply(null, live);
    if (times.length) return Math.min.apply(null, times);
    return Number(s.createdAt) || 0;
  }
  function countTiles(out, rows) {
    var won = rows.filter(function (r) { return r.won === true; }).length;
    var lost = rows.filter(function (r) { return r.won === false; }).length;
    var box = V.el("div", "stats");
    function tile(n, name, cls) {
      var t = V.el("div", "stat" + (cls ? " " + cls : ""));
      t.appendChild(V.el("b", null, String(n)));
      t.appendChild(V.el("span", null, name));
      box.appendChild(t);
    }
    tile(rows.length, "Games");
    tile(won, "Won", "go");
    tile(lost, "Lost", "bad");
    out.appendChild(box);
  }
  function toPick(row, kind, done) {
    var hit = kind === "winner" ? row.winnerHit : row.scoreHit;
    var who = row.winner === "2" ? row.away : row.home;
    var m = String(row.result || "").match(/^(\d+):(\d+)$/);
    var pick = {
      home: row.home,
      away: row.away,
      league: row.tourn || "Tennis",
      label: kind === "winner" ? who : (row.score || ""),
      price: Number(kind === "winner" ? row.winnerOdds : row.scoreOdds) || 0,
      kickoff: row.start,
      sport: "tn",
      status: row.hold || ""
    };
    if (row.hold) return pick;
    if (!done) return pick;
    pick.won = hit === true;
    pick.status = "Ended";
    pick.setScore = m ? m[1] + ":" + m[2] : "";
    if (m) pick.ft = { home: Number(m[1]), away: Number(m[2]) };
    return pick;
  }
  function toSlip(slip, rows, done) {
    var legs = rows.map(function (row) {
      var m = String(row.result || "").match(/^(\d+):(\d+)$/);
      var leg = {
        home: row.home, away: row.away, league: row.tourn || "Tennis",
        label: row.label || row.selection,
        price: Number(row.price) || 0,
        kickoff: row.start, sport: "tn",
        selection: row.selection, gameId: row.eventId,
        status: row.status || ""
      };
      if (row.status) return leg;
      if (done) {
        leg.won = row.hit === true;
        leg.status = "Ended";
        leg.setScore = m ? m[1] + ":" + m[2] : "";
        if (m) leg.ft = { home: Number(m[1]), away: Number(m[2]) };
      }
      return leg;
    });
    var all = done && legs.length > 0 && legs.every(function (l) { return l.won === true; });
    var odds = legs.reduce(function (n, l) { return n * (l.price > 1 ? l.price : 1); }, 1);
    return {
      id: slip.id,
      status: !done ? "open" : (all ? "won" : "lost"),
      quiet: true,
      legs: legs,
      stake: Number(slip.stake) || 0,
      combinedOdds: Number(slip.potential) > 0 && Number(slip.stake) > 0 ? Number(slip.potential) / Number(slip.stake) : odds,
      potential: Number(slip.potential) || odds * (Number(slip.stake) || 0),
      returned: all ? (slip.returned == null ? (Number(slip.potential) || 0) : Number(slip.returned)) : 0,
      shareCode: slip.code || "",
      shareUrl: slip.url || "",
      orderId: slip.orderId || "",
      payWith: slip.payWith || "",
      createdAt: slip.at,
      onDrop: slip.id ? function () {
        fetch("/api/slips?id=" + encodeURIComponent(slip.id) + "&tennis=slip", { method: "DELETE" })
          .then(readJson)
          .then(function (d) {
            if (!d || !d.ok) throw new Error((d && d.error) || "Could not delete");
            loadRecord();
          })
          .catch(function (e) { window.alert(e.message); });
      } : null
    };
  }
  function groupDays(out, items, dateOf, cardOf) {
    var last = "";
    items.forEach(function (it) {
      var d = V.dayLabel(dateOf(it));
      if (d && d !== last) { last = d; out.appendChild(V.el("div", "day", d)); }
      out.appendChild(cardOf(it));
    });
  }

  function render() {
    document.getElementById("v-matches").className = "chip" + (VIEW === "matches" && !bookish() ? " on" : "");
    document.getElementById("v-book").className = "chip" + (VIEW === "matches" && bookish() ? " on" : "");
    document.getElementById("v-record").className = "chip" + (VIEW === "record" ? " on" : "");
    if (VIEW === "record") { renderRecord(); return; }
    var out = document.getElementById("out");
    out.textContent = "";
    var list = LAST.filter(function (g) { return LEAGUE === "All" || g.tourn === LEAGUE; });
    if (bookish()) {
      var kinds = V.el("div", "chips");
      [["book", "All"], ["ms", "Men singles"], ["ws", "Women singles"]].forEach(function (pair) {
        var b = V.el("button", "chip" + (ONLY === pair[0] ? " on" : ""), pair[1]);
        b.addEventListener("click", function () { ONLY = pair[0]; render(); });
        kinds.appendChild(b);
      });
      out.appendChild(kinds);
      list = list.filter(hasBook);
      if (ONLY === "ms") list = list.filter(function (g) { return !isDoubles(g) && !isWoman(g); });
      if (ONLY === "ws") list = list.filter(function (g) { return !isDoubles(g) && isWoman(g); });
    } else {
      var lv = V.el("div", "chips");
      var nS = list.filter(function (g) { return levelOf(g) === "strong"; }).length;
      var nG = list.filter(function (g) { var l = levelOf(g); return l === "strong" || l === "good"; }).length;
      var nL = list.filter(function (g) { return !!levelOf(g); }).length;
      [["", "All"], ["strong", "Strong " + nS], ["good", "Good+ " + nG], ["lean", "Lean+ " + nL]].forEach(function (pair) {
        var b = V.el("button", "chip" + (STR === pair[0] ? " on" : ""), pair[1]);
        b.addEventListener("click", function () { STR = pair[0]; render(); });
        lv.appendChild(b);
      });
      out.appendChild(lv);
      var RANK = { strong: 3, good: 2, lean: 1 };
      if (STR) list = list.filter(function (g) { return (RANK[levelOf(g)] || 0) >= RANK[STR]; });
    }
    document.getElementById("head").textContent = (bookish() ? "Book — " : "Upcoming — ") + list.length;
    if (!list.length) {
      out.appendChild(V.el("div", "empty", bookish() ? "No book mark in this list." : (LAST.length ? "Nothing in that tournament." : "No upcoming tennis on SportyBet right now.")));
    } else list.forEach(function (g, i) { out.appendChild(safeCard(g, i + 1)); });
    tourns(LAST);
    V.tick();
  }

  function priceOf(g, sel) {
    if (!g) return null;
    if (sel === "1" && g.win) return Number(g.win.home);
    if (sel === "2" && g.win) return Number(g.win.away);
    var row = (g.scores || []).filter(function (s) { return s.sel === sel; })[0];
    return row ? Number(row.odds) : null;
  }
  function syncBook(games) {
    var legs = V.loadBook();
    var changed = false;
    var next = legs.map(function (l) {
      if (l.sport !== "tn") return l;
      var g = null;
      for (var i = 0; i < games.length; i++) {
        if (games[i].eventId && games[i].eventId === l.eventId) g = games[i];
      }
      if (!g) return l;
      var ref = g.selectionRefs && g.selectionRefs[l.selection];
      if (!ref) return Object.assign({}, l, { blocked: "Suspended" });
      var price = priceOf(g, l.selection);
      if (!(price > 1)) return l;
      if (Math.abs(price - Number(l.price)) < 0.01 && !l.blocked) return l;
      changed = true;
      return Object.assign({}, l, {
        price: price,
        marketId: ref.marketId || l.marketId,
        outcomeId: ref.outcomeId || l.outcomeId,
        specifier: ref.specifier || "",
        blocked: ""
      });
    });
    if (changed) V.saveBook(next);
  }
  function readJson(r) {
    return r.text().then(function (text) {
      try { return JSON.parse(text); }
      catch (e) { throw new Error("The list did not come back. Try again."); }
    });
  }
  function loadRecord() {
    return fetch("/api/tt?card=tennis&record=1").then(readJson).then(function (d) {
      if (!d || !d.ok) throw new Error((d && d.error) || "Could not load the record");
      BOOKED = d.booked || { rows: [] };
      BOOKS = d.books || [];
      if (VIEW === "record" || bookish()) render();
    }).catch(function (e) {
      if (VIEW !== "record") return;
      document.getElementById("out").textContent = "";
      document.getElementById("out").appendChild(V.el("div", "empty", e.message));
    });
  }
  function load(fresh) {
    return fetch("/api/tt?card=tennis" + (fresh ? "&fresh=1" : "")).then(readJson).then(function (d) {
      if (!d || !d.ok) throw new Error((d && d.error) || "Could not load tennis");
      var games = d.games || [];
      if (fresh && LAST.length) {
        var prev = {};
        LAST.forEach(function (g) { prev[g.eventId] = g; });
        games.forEach(function (g) {
          var old = prev[g.eventId];
          if (!old) return;
          if (!g.context && old.context) g.context = old.context;
          if (!g.ahead && old.ahead) g.ahead = old.ahead;
          if (!g.called && old.called) g.called = old.called;
          if (!g.withBook && old.withBook) g.withBook = old.withBook;
        });
      }
      LAST = games;
      if (d.record) RECORD = d.record;
      syncBook(LAST);
      render();
    }).catch(function (e) {
      if (fresh || LAST.length) return;
      document.getElementById("out").textContent = "";
      document.getElementById("out").appendChild(V.el("div", "empty", e.message));
    });
  }
  load(true);
  load(false);
  setInterval(function () { if (VIEW === "matches") load(true); }, 30000);
  document.getElementById("v-matches").addEventListener("click", function () { VIEW = "matches"; ONLY = ""; render(); });
  document.getElementById("v-book").addEventListener("click", function () { VIEW = "matches"; ONLY = "book"; render(); loadRecord(); });
  document.getElementById("v-record").addEventListener("click", function () { VIEW = "record"; ONLY = ""; render(); loadRecord(); });
  window.addEventListener("vfs-book", render);
})();
</script>
