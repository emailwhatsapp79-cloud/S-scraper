name: tn-card-probe
on:
  push:
    branches: [ccr-59cf78c4-n7ktec]
    paths: [.github/workflows/tn-card-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/122.0 Mobile Safari/537.36"
          for p in 1 2 3 4 5; do
            curl -s -m 20 -H "User-Agent: $UA" "https://www.sportybet.com/api/ng/factsCenter/pcUpcomingEvents?sportId=sr:sport:5&marketId=186&option=2&timeline=24&pageSize=100&pageNum=$p" \
              | jq -c '.data.tournaments[]? | .name as $t | .events[] | {t:$t, h:.homeTeamName, a:.awayTeamName, s:.estimateStartTime, o:[.markets[]? | select(.id=="186") | .outcomes[] | {id, odds, isActive}], st:([.markets[]? | select(.id=="186") | .status][0])}'
          done > card.jsonl
          echo "CARD_START"; cat card.jsonl; echo "CARD_END"
