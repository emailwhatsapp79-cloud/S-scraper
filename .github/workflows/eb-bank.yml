# Every 10 minutes: also pass scores24's newest finished TT matches to the app.
# Every minute: refresh open slips so live set alerts go out. Every ~10
# minutes (the route decides): save the eBasketball card and table tennis results. Its prices only show about an
# hour before tip-off, so without this most games are never priced. The route
# needs no key (it only reads SportyBet's public odds) and skips if it ran in
# the last 4 minutes.
#
# GitHub's own */10 schedule proved unreliable (it went hours without firing),
# so each run loops for ~5.5 hours, then starts the next run itself. The
# schedule stays as a fallback that restarts the chain if it ever breaks; a
# run that finds another one already looping exits at once.
name: eb-bank
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  id-token: write
concurrency:
  group: eb-bank
  cancel-in-progress: false
jobs:
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Skip if another run is already looping
        id: busy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow eb-bank.yml --status in_progress --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          echo "others=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.busy.outputs.others == '0'
      - name: Check slips every minute, bank cards every ~10, for ~5.5 hours
        if: steps.busy.outputs.others == '0'
        run: |
          end=$(( $(date +%s) + 330*60 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            # scores24 history every 10 minutes (it blocks Vercel, not GitHub)
            if [ $((i % 10)) -eq 0 ]; then bash .github/s24-push.sh 1 1 || true; fi
            i=$((i + 1))
            curl -sS --max-time 55 "https://vfootball-screener.vercel.app/api/poll?eb=1" || true
            echo
            sleep 60
          done
      - name: Start the next run
        if: steps.busy.outputs.others == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run eb-bank.yml -R "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
