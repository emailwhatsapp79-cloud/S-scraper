name: tn-probe
on:
  push:
    branches: [ccr-59cf78c4-n7ktec]
    paths: [.github/workflows/tn-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/122.0 Mobile Safari/537.36"
          now=$(date +%s000)
          for back in 1 7 30 90 180 365; do
            s=$(( $(date +%s) - back*86400 ))000; e=$(( $(date +%s) - (back-1)*86400 ))000
            curl -s -m 20 -H "User-Agent: $UA" "https://www.sportybet.com/api/ng/factsCenter/eventResultList?sportId=sr:sport:5&startTime=$s&endTime=$e&pageSize=100&pageNum=1" > r.json
            echo "day-$back: $(jq -c '{biz:.bizCode,total:.data.totalNum,t:[.data.tournaments[]?.name][0:6],n:([.data.tournaments[]?.events[]?]|length)}' r.json)"
          done
          jq -c '.data.tournaments[0].events[0] | {gameId,homeTeamName,awayTeamName,setScore,matchStatus,estimateStartTime,gameScore}' r.json
          D=$(date -u -d '-1 day' +%F)
          curl -s -m 20 -H "User-Agent: Mozilla/5.0" -H "Accept: application/json" "https://scores24.live/rapi/sport/tennis/leagues?date_between%5B%5D=$D%2000:00:00&date_between%5B%5D=$D%2023:59:59&lang=en&is_bot=false" | jq -c '[.data[] | .name] | map(select(test("ITF|UTR";"i"))) | length'
