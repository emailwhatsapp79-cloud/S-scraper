# Manual only. GitHub would not let us write FILL_KEY, so a 10-min cron
# just emails "failed" every run. The live 10-min bank is the Grok ping
# (and Vercel daily cron). Add repo secret FILL_KEY (= Vercel GATE_SECRET)
# then you can turn schedule back on.
name: vf-heartbeat
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Bank vFootball
        env:
          KEY: ${{ secrets.FILL_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then
            echo "FILL_KEY secret missing — add it in repo Settings → Secrets and Actions"
            exit 1
          fi
          curl -fsS --max-time 55 -H "x-fill-key: $KEY" \
            "https://vfootball-screener.vercel.app/api/poll?vf=1"
