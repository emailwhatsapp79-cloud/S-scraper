# Manual only. The eb-bank loop already calls the public vFootball heartbeat
# (/api/poll?vfpub=1) every 5 minutes; run this to cover a gap, e.g. until a
# running eb-bank loop restarts on newer workflow code. No key needed.
name: vf-heartbeat
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to keep calling it (minutes)
        default: "300"
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Bank vFootball every 5 minutes
        env:
          MINUTES: ${{ github.event.inputs.minutes }}
        run: |
          end=$(( $(date +%s) + ${MINUTES:-300}*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            curl -sS --max-time 40 "https://vfootball-screener.vercel.app/api/poll?vfpub=1" | head -c 200 || true
            echo
            sleep 300
          done
